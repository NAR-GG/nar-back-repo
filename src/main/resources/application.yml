server:
  # 무중단 배포에서 구 컨테이너는 nginx 전환 후 docker stop -t 35 로 내려간다.
  # 그 35초 안에 진행 중인 요청과 라이브 이벤트 저장·FCM 발송을 끝내고 죽어야 알림이 유실되지 않는다.
  shutdown: graceful

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      # 선수 이미지 업로드 상한. 기본값 1MB면 서비스단 2MB 검증에 닿기 전에 컨테이너가 막는다.
      max-file-size: 2MB
      max-request-size: 4MB
  # docker stop 의 35초보다 짧게 잡아, 강제 SIGKILL 전에 정상 종료가 끝나도록 한다.
  lifecycle:
    timeout-per-shutdown-phase: 30s

  task:
    execution:
      shutdown:
        # SET_END 푸시처럼 executor 에서 도는 알림 작업을 기다린다(스코어 재조회로 수십 초 걸릴 수 있음).
        await-termination: true
        await-termination-period: 25s

  jpa:
    properties:
      hibernate:
        format_sql: false
        # 배치 설정 (공통으로 사용)
        jdbc:
          batch_size: 50
          order_inserts: true
    # N+1 문제 방지를 위한 공통 설정
    open-in-view: false
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

app:
  # 백오피스 웹 OAuth 콜백 베이스 URL. target=backoffice 로 로그인 시 여기로 토큰 리다이렉트.
