nar:
  images:
    # 업로드된 선수 이미지 저장 위치. 배포는 -e IMAGES_DIR=/app/images + 호스트 볼륨 마운트.
    dir: ${IMAGES_DIR:data/images}
  data:
    ingestion:
      jdbc:
        parallel:
          enabled: ${NAR_DATA_INGESTION_JDBC_PARALLEL_ENABLED:false}
          threads: ${NAR_DATA_INGESTION_JDBC_PARALLEL_THREADS:4}
          max-in-flight: ${NAR_DATA_INGESTION_JDBC_PARALLEL_MAX_IN_FLIGHT:8}

firebase:
  messaging:
    enabled: ${FIREBASE_MESSAGING_ENABLED:false}

# 라이브 경기 FCM 푸시 파이프라인(#21). 기본 OFF.
# OFF 면 라이브 폴링 동작은 기존과 바이트 동일하다(새 발송/감지 부작용 없음).
# 활성화 전 라이브 경기 검증 필수. firebase.messaging.enabled 도 함께 켜져 있어야 실제 발송된다.
live:
  notification:
    fcm:
      enabled: ${LIVE_NOTIFICATION_FCM_ENABLED:false}
    set-end-score:
      # 세트 종료 푸시 스코어 재조회 창. 네이버 반영이 꼬리 케이스에서 60초를 넘겨
      # 스코어 누락 발송되던 문제로 창을 ~110초로 넓힘(12회×10초). 그만큼 알림은 늦어진다.
      retry-attempts: ${LIVE_SET_END_SCORE_RETRY_ATTEMPTS:12}
      retry-delay-ms: ${LIVE_SET_END_SCORE_RETRY_DELAY_MS:10000}

# 프로필 이미지 저장(Cloudinary 서명 업로드). 시크릿은 코드/깃에 박지 않고 env로 주입.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# 모바일 소셜 로그인 설정.
oauth:
  google:
    mobile:
      # Google 로그인 idToken 검증 시 허용할 aud(클라이언트 ID) 목록. 쉼표 구분.
      # 웹/iOS 클라이언트 ID가 다르면 둘 다 넣는다. 비워두면 aud 검증을 건너뛴다.
      client-ids: ${GOOGLE_MOBILE_CLIENT_IDS:12814317442-egra6e1lni0dmepp793sj5389qpsf1r0.apps.googleusercontent.com}
  apple:
    mobile:
      # Apple identity token 검증 시 허용할 aud(앱 번들 ID) 목록. 쉼표 구분. 비워두면 aud 검증을 건너뛴다.
      bundle-ids: ${APPLE_MOBILE_BUNDLE_IDS:com.nar.wardingapp}
