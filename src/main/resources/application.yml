server:
  # 무중단 배포에서 구 컨테이너는 nginx 전환 후 docker stop -t 35 로 내려간다.
  # 그 35초 안에 진행 중인 요청과 라이브 이벤트 저장·FCM 발송을 끝내고 죽어야 알림이 유실되지 않는다.
  shutdown: graceful

  # JSON 응답 gzip. 실측: /api/mobile/schedules/calendar?league=ALL 33,751B → 4,921B (85% 감소),
  # /schedules/filters 2,054B → 708B. 셀룰러에서 첫 화면 진입 체감에 직접 영향을 준다.
  #
  # 앞단 nginx(Ubuntu 기본 설정)는 gzip 자체는 on 이지만 gzip_types 가 비어 text/html 만
  # 압축한다. nginx 설정은 레포에 없어 서버 SSH 로만 바꿀 수 있으므로 WAS 에서 켠다.
  # nginx gzip 필터는 업스트림에 Content-Encoding 이 이미 있으면 건너뛰므로 이중 압축은 없다.
  #
  # mime-types 는 기본값에 application/json 이 이미 포함돼 있어 지정하지 않는다.
  # min-response-size 만 기본 2KB → 1KB 로 낮춘다(filters 가 2,054B 로 경계에 걸린다).
  compression:
    enabled: true
    min-response-size: 1KB

# Prometheus 스크랩용 메트릭 노출. actuator 와 micrometer-registry-prometheus 는 이미
# 의존성에 있었고 노출 목록만 기본값(health)이라 /actuator/prometheus 가 404 였다.
#
# 접근 제어는 앱이 아니라 nginx 가 한다 — SecurityConfig 는 /actuator/** 를 permitAll 로 둔다.
# api.nar.kr 은 /actuator/ 를 404 로 막고, 9105 포트(conf.d/nar-metrics.conf)만
# Tailscale 대역(100.64.0.0/10)에 열어 스크랩을 받는다. 메트릭에는 내부 엔드포인트 경로와
# 커넥션 풀·스케줄러 상태가 그대로 드러나므로 공개 도메인으로 새면 안 된다.
#
# 앞단 nginx 가 없는 환경(예: k8s)으로 옮기면 이 전제가 깨진다. 그때는 접근 제어를 앱으로 가져와야 한다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

  # 응답시간 히스토그램. 기본값은 _count 와 _sum 만 내보내서 평균밖에 못 구하는데,
  # 평균은 꼬리를 감춘다 — 요청 1%가 5초 걸려도 평균은 거의 안 움직인다.
  # _bucket 시리즈가 생겨야 PromQL 의 histogram_quantile 로 p95/p99 를 뽑을 수 있고,
  # 여러 엔드포인트를 합산한 서비스 단위 p95 도 그때 비로소 계산이 맞는다.
  #
  # 버킷은 시리즈 수를 그대로 곱하므로 기대 범위를 좁혀 카디널리티를 억제한다.
  # 10ms 미만은 구분할 실익이 없고, 10s 를 넘으면 어차피 다 같은 장애다.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 10s

spring:
  # Elasticsearch 리포지토리 스위치.
  #
  # SimpleElasticsearchRepository 생성자가 인덱스 정보를 받으려고 컨텍스트 로딩 중에 ES 에
  # 접속한다. ES 가 죽어 있으면 검색만 죽는 게 아니라 애플리케이션이 아예 안 뜬다.
  #
  # 2026-08-17 맥미니 컷오버가 앱과 DB 만 옮기고 ES 는 구 인프라(tailnet nar-es)에 두고 갔다.
  # 그 머신을 내리면 프로덕션이 부팅 불가가 되므로, 코드 배포 없이 끌 수 있는 손잡이를 둔다.
  #
  # 끄면 검색은 MySQL 폴백으로 동작한다(SearchService.findTeamsByKeyword). 관리자 색인 API 는
  # 실패하는데, 색인할 대상이 없으니 맞는 동작이다.
  #
  # 로컬에서 ES 없이 앱을 띄우려면 ES_REPOSITORIES_ENABLED=false 로 실행한다.
  data:
    elasticsearch:
      repositories:
        enabled: ${ES_REPOSITORIES_ENABLED:true}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 이미지 업로드(백오피스 공지 5MB·선수 2MB). 기본 1MB 면 서비스 검증 전에 스프링이 먼저 막는다.
  # 컨테이너 상한은 가장 큰 용도(공지 5MB)에 맞추고, 용도별 상한은 각 서비스 검증이 담당한다.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # docker stop 의 35초보다 짧게 잡아, 강제 SIGKILL 전에 정상 종료가 끝나도록 한다.
  lifecycle:
    timeout-per-shutdown-phase: 30s

  task:
    execution:
      shutdown:
        # SET_END 푸시처럼 executor 에서 도는 알림 작업을 기다린다(스코어 재조회로 수십 초 걸릴 수 있음).
        await-termination: true
        await-termination-period: 25s

  datasource:
    hikari:
      # 행 락 대기 상한을 커넥션마다 5초로 낮춘다(MySQL 기본 50초).
      #
      # 50초 대기는 사용자 입장에서 실패와 같은데 스레드와 커넥션만 붙잡는다. 실측
      # 2026-07-29 T1 vs KT 에서 세트 종료 푸시가 구독자마다 정확히 50초씩 락 대기 후
      # 타임아웃돼(fan-out 이 순차라) 알림 하나가 6분 넘게 밀렸고, 세트 시작 푸시는 폴링
      # 스레드를 17분간 세워 그 구간 라이브 이벤트가 통째로 누락됐다.
      #
      # 세션 변수라 DB 관리자 권한도 재시작도 필요 없고, 글로벌 값(50초)은 그대로 남아
      # 백업·수동 작업 등 앱 밖 세션에는 영향이 없다.
      connection-init-sql: "SET SESSION innodb_lock_wait_timeout = ${DB_LOCK_WAIT_TIMEOUT_SECONDS:5}"

  jpa:
    properties:
      hibernate:
        format_sql: false
        # 배치 설정 (공통으로 사용)
        jdbc:
          batch_size: 50
          order_inserts: true
    # N+1 문제 방지를 위한 공통 설정
    open-in-view: false
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

app:
  # 백오피스 웹 OAuth 콜백 베이스 URL. target=backoffice 로 로그인 시 여기로 토큰 리다이렉트.
  backoffice-url: ${BACKOFFICE_URL:http://localhost:5173}
  youtube:
    seed-channels:
      PRO_TEAMS:
        - "UCJprx3bX49vNl6Bcw01Cwfg" # T1
        - "UCrfB1-zWijAYkgfZW7Ehc8Q" # HLE
        - "UCDmmbxGg8g-EBkC_ku6vybg" # GEN.G
        - "UC8FErYSi74YwGUAoTpjvgzQ" # KT
        - "UC4PoHC-R9EeJYTuUv3ndmJw" # NS
        - "UCepHesz_5Lwr7qRaqjB-p1A" # DK
        - "UC5WN-znPsJK0BbA8aHxZHWQ" # DRX
        - "UCxedTJNaGRHiq6YfNtQVCNA" # BFX
        - "UCYQO6n0KZmwfwzWtm4_nAPA" # OK BRION
        - "UCGW76VChAJKee9kYzvyoycQ" # DNF
      SHORTS:
        - "UCORzxHO2quCHbE2fTo_snEg" # 롤뻔뻔
        - "UCBjjh72yM1KoMHfFhNBQr8w" # 대유쾌마운틴
        - "UCwvk_uRd0w-n0O1I4QRdM0g" # 롤꺾마

nar:
  data:
    ingestion:
      jdbc:
        parallel:
          enabled: ${NAR_DATA_INGESTION_JDBC_PARALLEL_ENABLED:false}
          threads: ${NAR_DATA_INGESTION_JDBC_PARALLEL_THREADS:4}
          max-in-flight: ${NAR_DATA_INGESTION_JDBC_PARALLEL_MAX_IN_FLIGHT:8}

firebase:
  messaging:
    enabled: ${FIREBASE_MESSAGING_ENABLED:false}

# 라이브 경기 FCM 푸시 파이프라인(#21). 기본 OFF.
# OFF 면 라이브 폴링 동작은 기존과 바이트 동일하다(새 발송/감지 부작용 없음).
# 활성화 전 라이브 경기 검증 필수. firebase.messaging.enabled 도 함께 켜져 있어야 실제 발송된다.
live:
  notification:
    fcm:
      enabled: ${LIVE_NOTIFICATION_FCM_ENABLED:false}
    set-end-score:
      # 세트 종료 푸시 스코어 재조회 창. 네이버 반영이 꼬리 케이스에서 60초를 넘겨
      # 스코어 누락 발송되던 문제로 창을 ~110초로 넓힘(12회×10초). 그만큼 알림은 늦어진다.
      retry-attempts: ${LIVE_SET_END_SCORE_RETRY_ATTEMPTS:12}
      retry-delay-ms: ${LIVE_SET_END_SCORE_RETRY_DELAY_MS:10000}

# 프로필 이미지 저장(Cloudinary 서명 업로드). 시크릿은 코드/깃에 박지 않고 env로 주입.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  # Riot 계열 원본(static.lolesports/ddragon/communitydragon)을 Cloudinary fetch 로 감싼다.
  # Cloudinary 콘솔의 Allowed fetch domains 에 같은 3개가 등록돼 있어야 동작한다.
  cdn-enabled: ${CLOUDINARY_CDN_ENABLED:true}
  # 무료 티어 25 credits 소진 감시. 집계가 1~2일 늦어 임계를 낮게 잡는다.
  quota-alert-percent: ${CLOUDINARY_QUOTA_ALERT_PERCENT:60}
  quota-check-cron: ${CLOUDINARY_QUOTA_CHECK_CRON:0 0 10 * * *}

# 모바일 소셜 로그인 설정.
oauth:
  google:
    mobile:
      # Google 로그인 idToken 검증 시 허용할 aud(클라이언트 ID) 목록. 쉼표 구분.
      # 웹/iOS 클라이언트 ID가 다르면 둘 다 넣는다. 비워두면 aud 검증을 건너뛴다.
      client-ids: ${GOOGLE_MOBILE_CLIENT_IDS:12814317442-egra6e1lni0dmepp793sj5389qpsf1r0.apps.googleusercontent.com}
  apple:
    mobile:
      # Apple identity token 검증 시 허용할 aud(앱 번들 ID) 목록. 쉼표 구분. 비워두면 aud 검증을 건너뛴다.
      bundle-ids: ${APPLE_MOBILE_BUNDLE_IDS:com.nar.wardingapp}

# 솔랭 종료 알림(전역 스위치). 앱의 시작/종료 토글 UI 가 배포된 뒤에 켠다.
# 사용자 토글(member_favorite_player.end_enabled, 기본 OFF)과 별개다 —
# 이게 꺼져 있으면 전이 감지도 match-v5 조회도 발송도 하지 않는다.
solo-rank:
  end-notification:
    enabled: ${SOLO_RANK_END_NOTIFICATION_ENABLED:false}
    sweep-interval-ms: ${SOLO_RANK_END_SWEEP_INTERVAL_MS:30000}
    initial-delay-ms: ${SOLO_RANK_END_INITIAL_DELAY_MS:60000}
