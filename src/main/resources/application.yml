spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    properties:
      hibernate:
        format_sql: false
        # 배치 설정 (공통으로 사용)
        jdbc:
          batch_size: 50
          order_inserts: true
    # N+1 문제 방지를 위한 공통 설정
    open-in-view: false
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

app:
  # 백오피스 웹 OAuth 콜백 베이스 URL. target=backoffice 로 로그인 시 여기로 토큰 리다이렉트.
  backoffice-url: ${BACKOFFICE_URL:http://localhost:5173}
  youtube:
    seed-channels:
      PRO_TEAMS:
        - "UCJprx3bX49vNl6Bcw01Cwfg" # T1
        - "UCrfB1-zWijAYkgfZW7Ehc8Q" # HLE
        - "UCDmmbxGg8g-EBkC_ku6vybg" # GEN.G
        - "UC8FErYSi74YwGUAoTpjvgzQ" # KT
        - "UC4PoHC-R9EeJYTuUv3ndmJw" # NS
        - "UCepHesz_5Lwr7qRaqjB-p1A" # DK
        - "UC5WN-znPsJK0BbA8aHxZHWQ" # DRX
        - "UCxedTJNaGRHiq6YfNtQVCNA" # BFX
        - "UCYQO6n0KZmwfwzWtm4_nAPA" # OK BRION
        - "UCGW76VChAJKee9kYzvyoycQ" # DNF
      SHORTS:
        - "UCORzxHO2quCHbE2fTo_snEg" # 롤뻔뻔
        - "UCBjjh72yM1KoMHfFhNBQr8w" # 대유쾌마운틴
        - "UCwvk_uRd0w-n0O1I4QRdM0g" # 롤꺾마

nar:
  data:
    ingestion:
      jdbc:
        parallel:
          enabled: ${NAR_DATA_INGESTION_JDBC_PARALLEL_ENABLED:false}
          threads: ${NAR_DATA_INGESTION_JDBC_PARALLEL_THREADS:4}
          max-in-flight: ${NAR_DATA_INGESTION_JDBC_PARALLEL_MAX_IN_FLIGHT:8}

firebase:
  messaging:
    enabled: ${FIREBASE_MESSAGING_ENABLED:false}

# 라이브 경기 FCM 푸시 파이프라인(#21). 기본 OFF.
# OFF 면 라이브 폴링 동작은 기존과 바이트 동일하다(새 발송/감지 부작용 없음).
# 활성화 전 라이브 경기 검증 필수. firebase.messaging.enabled 도 함께 켜져 있어야 실제 발송된다.
live:
  notification:
    fcm:
      enabled: ${LIVE_NOTIFICATION_FCM_ENABLED:false}

# 프로필 이미지 저장(Cloudinary 서명 업로드). 시크릿은 코드/깃에 박지 않고 env로 주입.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
