spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
    open-in-view: false

notification:
  enabled: true
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL}

# 로깅 관련 공통 설정
logging:
  level:
    org.hibernate.SQL: info

