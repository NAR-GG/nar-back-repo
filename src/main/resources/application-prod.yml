server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        rewriteBatchedStatements: true

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 30

  elasticsearch:
    uris: ${ELASTICSEARCH_URI}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: account_email
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

notification:
  enabled: true
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}
    player-webhook-url: ${DISCORD_PLAYER_WEBHOOK_URL:}
  scheduler:
    summary-enabled: ${SCHEDULER_SUMMARY_ENABLED:true}
    daily-summary-cron: ${SCHEDULER_DAILY_SUMMARY_CRON:0 0 9 * * *}
    summary-zone: ${SCHEDULER_SUMMARY_ZONE:Asia/Seoul}
    failure-cooldown-minutes: ${SCHEDULER_FAILURE_COOLDOWN_MINUTES:10}
    warning-cooldown-minutes: ${SCHEDULER_WARNING_COOLDOWN_MINUTES:60}
    zero-new-games-threshold: ${SCHEDULER_ZERO_NEW_GAMES_THRESHOLD:3}

logging:
  level:
    org.hibernate.SQL: info
    # 애플리케이션 레이어에서 이미 실패 로그를 남기므로 netty 커넥션 WARN 중복을 막는다
    reactor.netty.http.client.HttpClientConnect: ERROR

google:
  drive:
    csv-file-id: ${GOOGLE_DRIVE_CSV_ID}
  youtube:
    api:
      key: ${YOUTUBE_API_KEY}
      base-url: "https://www.googleapis.com/youtube/v3"

app:
  server:
    url: "https://api.nar.kr"
  frontend-url: ${FRONTEND_URL:https://nar.kr}
  mobile-redirect-url: ${MOBILE_REDIRECT_URL:nar://oauth/callback}

jwt:
  secret: ${JWT_SECRET}

riot:
  api:
    enabled: ${RIOT_API_ENABLED:false}
    key: ${RIOT_API_KEY:}
    regional-base-url: ${RIOT_API_REGIONAL_BASE_URL:https://asia.api.riotgames.com}
    kr-base-url: ${RIOT_API_KR_BASE_URL:https://kr.api.riotgames.com}
    request-timeout-ms: ${RIOT_API_REQUEST_TIMEOUT_MS:3000}
  monitor:
    enabled: ${RIOT_MONITOR_ENABLED:false}
    poll-interval-ms: ${RIOT_MONITOR_POLL_INTERVAL_MS:60000}
    initial-delay-ms: ${RIOT_MONITOR_INITIAL_DELAY_MS:15000}
    target-league: ${RIOT_MONITOR_TARGET_LEAGUE:LCK}
    platform: ${RIOT_MONITOR_PLATFORM:KR}

player:
  profile-sync:
    # LCK 선수 프로필 동기화 크론(KST). 기본 매일 새벽 5시 30분
    cron: ${PLAYER_PROFILE_SYNC_CRON:0 30 5 * * *}

lolesports:
  riot-api:
    key: ${LOL_ESPORTS_KEY}
  sync:
    cron: ${LOL_SYNC_CRON:0 0/30 * * * *}
    team-metadata-cron: ${LOL_TEAM_METADATA_CRON:0 15 4 * * *}
    active-leagues: ${LOL_ACTIVE_LEAGUES:LCK,LPL,LEC,LCS,LCP,CBLOL,MSI,WORLDS,FIRST_STAND}
  live:
    enabled: ${LOL_LIVE_ENABLED:false}
    # 디스커버리 대상 리그를 active+오늘경기 리그로 좁혔으므로(보통 0~2개) 10초로 단축.
    # 라이브 시작 인식 지연을 줄인다. 경기 없는 시간대엔 외부 호출 0회.
    discovery-interval-ms: 10000
    poll-interval-ms: 5000
    stale-threshold-ms: 180000
    request-timeout-ms: 3000
    max-consecutive-failures: 6
    queue:
      snapshot-capacity: ${LOL_LIVE_SNAPSHOT_QUEUE_CAPACITY:600}
      object-capacity: ${LOL_LIVE_OBJECT_QUEUE_CAPACITY:1200}

nar:
  data:
    ingestion:
      jdbc:
        parallel:
          enabled: ${NAR_DATA_INGESTION_JDBC_PARALLEL_ENABLED:false}
          threads: ${NAR_DATA_INGESTION_JDBC_PARALLEL_THREADS:4}
          max-in-flight: ${NAR_DATA_INGESTION_JDBC_PARALLEL_MAX_IN_FLIGHT:8}

# 라이브 경기 FCM 푸시 파이프라인(#21). 기본 OFF (env LIVE_NOTIFICATION_FCM_ENABLED 로 오버라이드).
# OFF 면 라이브 폴링 동작은 기존과 바이트 동일하다. 활성화 전 라이브 경기 검증 필수.
live:
  notification:
    fcm:
      enabled: ${LIVE_NOTIFICATION_FCM_ENABLED:false}
