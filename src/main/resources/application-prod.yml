spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

notification:
  enabled: true
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL}

# 로깅 관련 공통 설정
logging:
  level:
    org.hibernate.SQL: info

google:
  drive:
    csv-file-id: ${GOOGLE_DRIVE_CSV_ID}
  youtube:
    api:
      key: ${YOUTUBE_API_KEY}
      base-url: "https://www.googleapis.com/youtube/v3"

app:
  server:
    url: "https://api.nar.kr"

lolesports:
  riot-api:
    key: ${LOL_ESPORTS_KEY}