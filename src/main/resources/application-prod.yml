server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 30

  elasticsearch:
    uris: ${ELASTICSEARCH_URI}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname, account_email
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

notification:
  enabled: true
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}
    player-webhook-url: ${DISCORD_PLAYER_WEBHOOK_URL:}
  scheduler:
    summary-enabled: ${SCHEDULER_SUMMARY_ENABLED:true}
    daily-summary-cron: ${SCHEDULER_DAILY_SUMMARY_CRON:0 0 9 * * *}
    summary-zone: ${SCHEDULER_SUMMARY_ZONE:Asia/Seoul}
    failure-cooldown-minutes: ${SCHEDULER_FAILURE_COOLDOWN_MINUTES:10}
    warning-cooldown-minutes: ${SCHEDULER_WARNING_COOLDOWN_MINUTES:60}
    zero-new-games-threshold: ${SCHEDULER_ZERO_NEW_GAMES_THRESHOLD:3}

logging:
  level:
    org.hibernate.SQL: info

google:
  drive:
    csv-file-id: ${GOOGLE_DRIVE_CSV_ID}
  youtube:
    api:
      key: ${YOUTUBE_API_KEY}
      base-url: "https://www.googleapis.com/youtube/v3"

app:
  server:
    url: "https://api.nar.kr"
  frontend-url: ${FRONTEND_URL:https://nar.kr}

jwt:
  secret: ${JWT_SECRET}

riot:
  api:
    enabled: ${RIOT_API_ENABLED:false}
    key: ${RIOT_API_KEY:}
    regional-base-url: ${RIOT_API_REGIONAL_BASE_URL:https://asia.api.riotgames.com}
    kr-base-url: ${RIOT_API_KR_BASE_URL:https://kr.api.riotgames.com}
    request-timeout-ms: ${RIOT_API_REQUEST_TIMEOUT_MS:3000}
  monitor:
    enabled: ${RIOT_MONITOR_ENABLED:false}
    poll-interval-ms: ${RIOT_MONITOR_POLL_INTERVAL_MS:60000}
    initial-delay-ms: ${RIOT_MONITOR_INITIAL_DELAY_MS:15000}
    target-league: ${RIOT_MONITOR_TARGET_LEAGUE:LCK}
    platform: ${RIOT_MONITOR_PLATFORM:KR}

lolesports:
  riot-api:
    key: ${LOL_ESPORTS_KEY}
  sync:
    cron: ${LOL_SYNC_CRON:0 0/30 * * * *}
    team-metadata-cron: ${LOL_TEAM_METADATA_CRON:0 15 4 * * *}
    active-leagues: ${LOL_ACTIVE_LEAGUES:LCK,LPL,LEC,LCS,LCP,CBLOL,MSI,WORLDS,FIRST_STAND}
  live:
    enabled: true
    discovery-interval-ms: 60000
    poll-interval-ms: 10000
    stale-threshold-ms: 180000
    request-timeout-ms: 3000
    max-consecutive-failures: 6
