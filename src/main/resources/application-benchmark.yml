spring:
  datasource:
    url: jdbc:mysql://localhost:3308/lol_esports_benchmark?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${BENCHMARK_DB_USERNAME:nar_id}
    password: ${BENCHMARK_DB_PASSWORD:nar_pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: false


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: benchmark-client-id
            client-secret: benchmark-client-secret
            scope: email, profile

jwt:
  secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: nar

notification:
  enabled: false
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}
    player-webhook-url: ${DISCORD_PLAYER_WEBHOOK_URL:}
  scheduler:
    summary-enabled: false

app:
  server:
    url: ${APP_SERVER_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mobile-redirect-url: ${MOBILE_REDIRECT_URL:nar://oauth/callback}

riot:
  api:
    enabled: false
    key: ${RIOT_API_KEY:}
  monitor:
    enabled: false

lolesports:
  riot-api:
    key: ${LOL_ESPORTS_KEY:benchmark-dummy-key}
  live:
    enabled: false

nar:
  data:
    ingestion:
      jdbc:
        parallel:
          enabled: ${NAR_DATA_INGESTION_JDBC_PARALLEL_ENABLED:true}
          threads: ${NAR_DATA_INGESTION_JDBC_PARALLEL_THREADS:4}
          max-in-flight: ${NAR_DATA_INGESTION_JDBC_PARALLEL_MAX_IN_FLIGHT:8}
