# Cloudflare Tunnel (맥미니, 호스트판) — ⚠️ 2026-08-22 부터 롤백 전용이다.
#
# 실운영은 클러스터 안 파드다: `infra/k8s/cloudflared.yaml`.
# 이 파일은 그 파드가 못 뜰 때 되돌아올 자리로만 남겨 둔다. launchd 유닛도 unload 만
# 해뒀고 지우지 않았다.
#
#   롤백:  kubectl -n nar scale deploy/cloudflared --replicas=0   # 먼저 파드를 내린다
#          launchctl load ~/Library/LaunchAgents/com.nar.cloudflared.plist
#
# 순서가 중요하다. 두 판을 같이 띄우면 커넥터가 두 벌 등록돼 Cloudflare 가 아무
# 쪽에나 보낸다 — 검증 중에는 그게 의도지만, 롤백 중에는 원인 판별을 망친다.
#
# 아래 목적지(127.0.0.1:30082/30443)는 호스트→VM 포워딩을 탄다. 그 포워딩이 죽어서
# 2026-08-21 에 서비스가 내려갔고, 이관의 이유가 그것이다.
#
# ── 아래는 호스트판 원본 ─────────────────────────────────────────────
#
# 대시보드가 아니라 이 파일이 진실의 원천이다. Zero Trust 구독(카드 등록) 없이
# 쓰려고 로컬 관리형을 택했고, 덕분에 설정을 저장소에 커밋할 수 있다.
#
# 집에서 Cloudflare 로 나가는 아웃바운드 연결만 쓴다. 공유기 포트 개방도,
# 고정 IP 도, DDNS 도 필요 없다.

tunnel: c194bfaa-f127-4bd7-89a7-c71262c296f0
credentials-file: /Users/changha/.cloudflared/c194bfaa-f127-4bd7-89a7-c71262c296f0.json

ingress:
  # 실트래픽. Traefik(k3s NodePort)이 받아 파드로 넘긴다.
  # 라우팅·인증·차단 규칙은 infra/k8s/traefik-routes.yaml — Git 이 원본이다.
  - hostname: api.nar.kr
    service: http://127.0.0.1:30082

  # ArgoCD 관리자 UI. **Cloudflare Access 가 앞에서 이메일 인증으로 막는다** —
  # 이 규칙만으로는 관리자 UI 가 공개 인터넷에 그대로 열린다.
  # Access 앱을 지우거나 정책을 풀면 이 호스트도 같이 내려야 한다.
  #
  # 30443 은 k3s NodePort(argocd-server)다. ArgoCD 가 자체 서명 TLS 를 쓰므로
  # noTLSVerify 가 필요하다. 이 구간은 맥미니 안이라 검증을 꺼도 외부 노출이 아니다.
  - hostname: argocd.nar.kr
    service: https://127.0.0.1:30443
    originRequest:
      noTLSVerify: true

  # 컷오버 전 그림자 검증에 쓰던 호스트. 지금은 api.nar.kr 과 같은 곳을 가리킨다.
  - hostname: home.nar.kr
    service: http://127.0.0.1:30082

  # 위 규칙에 안 걸리는 요청은 버린다. 터널이 열려 있다고 해서
  # 맥미니의 다른 포트가 노출되면 안 된다.
  - service: http_status:404
