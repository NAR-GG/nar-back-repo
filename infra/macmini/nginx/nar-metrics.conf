# 앱 메트릭 노출 (Prometheus 스크랩용)
#
# 앱 컨테이너를 직접 스크랩하지 않고 nginx 를 거치는 이유는 블루-그린이다.
# 앱이 8080 ↔ 8083 을 오가는데 고정 포트를 스크랩하면 배포 때마다 타깃이 죽는다.
# upstream nar_backend 를 참조하면 전환을 자동으로 따라간다.
#
# 127.0.0.1 에만 바인딩한다. Prometheus 는 Colima 안 컨테이너지만
# host.docker.internal 이 호스트 루프백으로 NAT 되므로 닿는다(MySQL 과 같은 경로).
# EC2 판은 Tailscale 대역 allow/deny 를 썼는데, 여기서는 바인딩만으로 충분해서 규칙이 없다.
server {
    listen 127.0.0.1:9105;

    location /actuator/ {
        proxy_pass http://nar_backend;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}
