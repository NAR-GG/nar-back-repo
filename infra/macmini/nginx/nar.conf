# api.nar.kr 앞단 (맥미니)
#
# EC2 의 sites-enabled/api.nar.kr 을 옮긴 것이다. 달라진 점은 TLS 가 없다는 것 —
# Cloudflare 가 종단하고 cloudflared 가 평문으로 여기에 넘긴다. certbot 블록,
# 443 리스너, 80 → 443 리다이렉트가 전부 불필요해졌다.
#
# 8081 인 이유: 앱 컨테이너가 8080/8083(블루-그린)을 쓰고 brew nginx 기본값도 8080 이라
# 셋이 겹친다.

server {
    listen 127.0.0.1:8081;
    server_name api.nar.kr;

    # cloudflared 를 거치면 $remote_addr 이 127.0.0.1 이 된다. 실제 클라이언트 IP 는
    # Cloudflare 가 CF-Connecting-IP 에 넣어 보내므로 그걸 원본으로 쓴다.
    # 이게 없으면 Sentry 이벤트와 접근 로그의 IP 가 전부 127.0.0.1 로 찍힌다.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    location /actuator/ { return 404; }

    location / {
        proxy_pass http://nar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /swagger-ui {
        auth_basic "Swagger Login";
        auth_basic_user_file /opt/homebrew/etc/nginx/.htpasswd;

        proxy_pass http://nar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /v3/api-docs {
        auth_basic "Restricted Access";
        auth_basic_user_file /opt/homebrew/etc/nginx/.htpasswd;

        proxy_pass http://nar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ponytail: /dozzle 과 9105 메트릭 블록은 아직 안 옮겼다.
#   - dozzle 은 컨테이너를 안 띄웠으므로 지금 넣으면 502 만 난다.
#   - 9105 는 EC2 에서 Tailscale 대역(100.64.0.0/10)만 허용하는데, 맥미니에서는
#     Prometheus 가 같은 호스트의 컨테이너라 출발지 IP 가 100.x 가 아니다.
#     실제 출발지를 재본 뒤 허용 대역을 정한다. 컷오버 때 처리한다.
