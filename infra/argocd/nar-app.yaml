# ArgoCD 가 `infra/k8s` 를 보고 클러스터를 맞춘다.
#
# main 이 아니라 deploy 브랜치를 본다. main 은 PR 필수라 CI 가 이미지 태그를 직접
# 못 밀기 때문이다. deploy 는 배포 워크플로가 "main + 이미지 태그 한 줄" 로 매번
# 새로 만들어 강제 푸시한다(.github/workflows/deploy-macmini.yml 마지막 스텝).
#
# 즉 deploy 브랜치는 **실제로 떠서 검증까지 끝난 이미지**만 가리킨다.
# 배포가 실패하면 그 스텝까지 도달하지 못한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nar
  namespace: argocd
  annotations:
    # 배포 완료(싱크 성공 + Healthy)·싱크 실패 시 디스코드 알림 (notifications-cm.yaml)
    notifications.argoproj.io/subscribe.on-deployed.discord: ""
    notifications.argoproj.io/subscribe.on-sync-failed.discord: ""
spec:
  project: default
  source:
    repoURL: git@github.com:NAR-GG/nar-back-repo.git
    targetRevision: deploy
    path: infra/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: nar
  syncPolicy:
    automated:
      # 손으로 바꾼 것을 Git 상태로 되돌린다. 이걸 꺼두면 클러스터가 조용히 갈라진다.
      selfHeal: true
      # Git 에서 사라진 리소스를 클러스터에서도 지운다.
      prune: true
    syncOptions:
      - CreateNamespace=true
