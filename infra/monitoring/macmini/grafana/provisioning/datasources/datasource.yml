apiVersion: 1

# uid 를 고정해야 대시보드 JSON 이 데이터소스를 안정적으로 참조한다.
# 처음 프로비저닝 때 uid 없이 만들면 Grafana 가 랜덤 uid 를 붙이고, 나중에 uid 를 지정하면
# "data source not found" 로 부팅이 실패한다. 그래서 먼저 지우고 다시 만든다.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Tempo
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # 로그 → 트레이스. 앱 로그 `ERROR [<32자 trace_id>,<span_id>,<flags>]` 에서 trace_id 를 뽑아
      # Tempo 로 점프하는 링크를 건다. (application-prod.yml logging.pattern.level)
      # flags 의 최하위 비트(sampled)가 켜진 줄에만 건다 — 샘플링 10% 라 나머지 id 는 Tempo 에 없어 빈 화면이 된다.
      # 실측(2026-10-05): 샘플됨=`03`, 샘플 제외=`02`. `02` 의 비트1 은 W3C 의 random-trace-id 플래그라 `01` 이 아니다.
      # 그래서 `01` 로 못박으면 아무 줄에도 안 걸린다(#554 가 그랬다). 최하위 비트로 판정한다.
      derivedFields:
        - name: trace_id
          matcherRegex: '\[([0-9a-f]{32}),[0-9a-f]{16},[0-9a-f][13579bdf]\]'
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: Tempo 에서 보기

  # 트레이스. 로그 ↔ 트레이스 연결은 위 Loki derivedFields 와 아래 tracesToLogsV2 가 짝이다.
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # 트레이스 → 로그. 로그에 trace_id 라벨은 없으므로 본문 검색으로 건다.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        customQuery: true
        query: '{namespace="nar"} |= "$${__trace.traceId}"'
