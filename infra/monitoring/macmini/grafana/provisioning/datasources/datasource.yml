apiVersion: 1

# uid 를 고정해야 대시보드 JSON 이 데이터소스를 안정적으로 참조한다.
# 처음 프로비저닝 때 uid 없이 만들면 Grafana 가 랜덤 uid 를 붙이고, 나중에 uid 를 지정하면
# "data source not found" 로 부팅이 실패한다. 그래서 먼저 지우고 다시 만든다.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Tempo
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false

  # 트레이스. 로그→트레이스 연결(derivedFields)은 앱 로그에 trace_id 가 찍힌 뒤에 붙인다.
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
