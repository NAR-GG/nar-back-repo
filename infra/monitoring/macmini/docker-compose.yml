services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

  # 크론잡 감시 지표 수신. 백업·복제감시·watchdog·복원검증 스크립트가 끝날 때
  # "언제 돌았고 성공했나"를 여기로 push 하고 Prometheus 가 긁어간다.
  # 크론은 pull 이 불가능하다 — 잡이 죽으면 긁을 대상 자체가 없다. 그래서 push 고,
  # 진짜 신호는 "마지막 성공이 오래됐다"(침묵 감지)다.
  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"

  # 맥미니 MySQL 복제 지연 감시. 호스트 MySQL 에 host.docker.internal 로 붙는다.
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    restart: unless-stopped
    command:
      - --config.my-cnf=/cfg/.my.cnf
    volumes:
      - ./mysqld-exporter/.my.cnf:/cfg/.my.cnf:ro

  # 맥미니 컨테이너 로그 → Loki. EC2 는 자기 Alloy 가 Tailscale 로 밀어넣는다.
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # k3s 파드 로그. 파드는 containerd 로 돌아 docker.sock 에 안 잡힌다.
      # 이걸 안 물리면 앱을 파드로 옮기는 순간 Loki 에서 앱 로그가 통째로 사라진다.
      # (경로는 VM 안이다. alloy 도 같은 VM 의 docker 에서 돌아 그대로 보인다)
      - /var/log/pods:/var/log/pods:ro

volumes:
  prom-data:
  loki-data:
  grafana-data:
