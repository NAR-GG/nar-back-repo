# nginx nar.conf 를 Traefik 선언으로 옮긴 것. 원본과 1:1 대응:
#
#   nginx                          여기
#   ─────────────────────────────  ─────────────────────────────
#   location /actuator/ → 404      actuator-deny (ipAllowList → 403)
#   location /swagger-ui  + auth   docs-auth 미들웨어 (같은 htpasswd)
#   location /v3/api-docs + auth   docs-auth 미들웨어
#   X-Forwarded-Proto https 강제   force-https-proto 미들웨어
#   real_ip CF-Connecting-IP       Traefik 의 forwardedHeaders 신뢰 + 앱이 XFF 를 읽음
#
# Traefik 은 매치 규칙이 긴 라우터가 우선이다(우선순위 명시 없이도 /actuator 가
# 루트 라우터보다 먼저 걸린다). 그래도 의도를 명시하려고 priority 를 박았다.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: actuator-deny
  namespace: nar
spec:
  # 어떤 IP 도 매치되지 않는 대역 → 전부 403.
  # nginx 는 404 를 줬는데 Traefik 에는 정적 응답 미들웨어가 없다.
  # 숨기는 목적(404)보다 막는 목적(403)이 본질이라 이걸로 충분하다.
  ipAllowList:
    sourceRange:
      - 255.255.255.255/32
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: docs-auth
  namespace: nar
spec:
  basicAuth:
    # nginx 의 .htpasswd 그대로 (sealed-secrets 로 봉인, docs-auth-sealed.yaml)
    secret: docs-auth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: force-https-proto
  namespace: nar
spec:
  # TLS 는 Cloudflare 가 종단하므로 Traefik 까지는 평문(web 엔트리포인트)이다.
  # 그대로 두면 X-Forwarded-Proto=http 로 넘어가 앱이 http 링크를 만든다.
  # nginx 도 같은 이유로 https 를 강제했다.
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nar-web
  namespace: nar
spec:
  entryPoints:
    - web
  routes:
    # 순서 주의: priority 큰 것이 먼저 평가된다.

    # 1) /actuator 차단 — 뚫리면 힙덤프·환경변수까지 노출되는 경로다.
    - match: (Host(`api.nar.kr`) || Host(`home.nar.kr`)) && PathPrefix(`/actuator`)
      kind: Rule
      priority: 100
      middlewares:
        - name: actuator-deny
      services:
        - name: nar-web
          port: 8080

    # 2) API 문서 — Basic Auth
    - match: (Host(`api.nar.kr`) || Host(`home.nar.kr`)) && (PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`))
      kind: Rule
      priority: 90
      middlewares:
        - name: docs-auth
        - name: force-https-proto
      services:
        - name: nar-web
          port: 8080

    # 3) 나머지 전부 → 앱
    - match: Host(`api.nar.kr`) || Host(`home.nar.kr`)
      kind: Rule
      priority: 10
      middlewares:
        - name: force-https-proto
      services:
        - name: nar-web
          port: 8080
