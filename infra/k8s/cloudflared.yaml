# Cloudflare Tunnel — 클러스터 안. 호스트 launchd(`infra/macmini/launchd/com.nar.cloudflared.plist`)
# 에서 옮겨온 것이다.
#
# ## 왜 옮기나
#
# 호스트에 있으면 모든 요청이 **호스트 → Colima VM 경계**를 건넌다.
#
#   전:  cloudflared(호스트) → 127.0.0.1:30082 → Lima 포워딩 → VM → Traefik
#   후:  cloudflared(파드) → traefik.traefik.svc → 파드            (경계 없음)
#
# 그 포워딩이 2026-08-21 에 죽어서 서비스가 통째로 내려갔다. 포워딩은 ssh mux master
# 프로세스가 붙들고 있는데, 그게 fd 를 다 쓰고(launchd soft limit 256) 죽으면 같이 사라진다.
# 감시자(`nar-forward-guard.sh`)를 붙여 복구를 30초로 줄였지만, 경계를 안 건너면
# 이 장애 유형 자체가 사라진다. 파드 fd 한도는 1,048,576 — 같은 축으로는 다시 안 걸린다.
#
# 포워딩이 없어지는 게 아니라 **의존하는 대상이 바뀐다**. 죽어도 kubectl·ArgoCD UI 만
# 안 되고 실서비스는 산다.
#
# ## 대가 하나
#
# k3s 가 안 뜨면 터널도 안 뜬다. 전에는 터널만 살아 있었지만, 어차피 api·argocd 둘 다
# k3s 뒤라 실질 가용성 차이는 없었다(둘 다 502). 부트스트랩 순서만 기억하면 된다 —
# 클러스터가 먼저다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: nar
data:
  config.yml: |
    # 로컬 관리형 터널. 대시보드가 아니라 이 파일이 진실의 원천이다.
    tunnel: c194bfaa-f127-4bd7-89a7-c71262c296f0
    credentials-file: /etc/cloudflared-creds/credentials.json

    # /ready 로 커넥터 등록 여부를 본다. readinessProbe 가 이걸 읽는다.
    metrics: 0.0.0.0:2000

    ingress:
      # 실트래픽. 라우팅·인증·차단 규칙은 traefik-routes.yaml 이 갖는다.
      # 클러스터 DNS 라 NodePort(30082)도 Lima 포워딩도 안 탄다.
      - hostname: api.nar.kr
        service: http://traefik.traefik.svc.cluster.local:80

      # ArgoCD 관리자 UI. **Cloudflare Access 가 앞에서 이메일 인증으로 막는다** —
      # 이 규칙만으로는 관리자 UI 가 공개 인터넷에 그대로 열린다.
      # Access 앱을 지우거나 정책을 풀면 이 호스트도 같이 내려야 한다.
      #
      # ArgoCD 가 자체 서명 TLS 를 쓰므로 noTLSVerify 가 필요하다.
      # 이 구간은 클러스터 안이라 검증을 꺼도 외부 노출이 아니다.
      - hostname: argocd.nar.kr
        service: https://argocd-server.argocd.svc.cluster.local:443
        originRequest:
          noTLSVerify: true

      # 컷오버 전 그림자 검증에 쓰던 호스트. 지금은 api.nar.kr 과 같은 곳을 가리킨다.
      - hostname: home.nar.kr
        service: http://traefik.traefik.svc.cluster.local:80

      # 위 규칙에 안 걸리는 요청은 버린다. 터널이 열려 있다고 해서
      # 클러스터의 다른 서비스가 노출되면 안 된다.
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: nar
spec:
  # HA 가 아니다 — 노드가 하나라 노드가 죽으면 둘 다 죽는다.
  # 파드 하나가 죽거나(OOM·evict) 롤링으로 교체될 때 **터널 커넥터가 안 끊기게** 하는
  # 용도다. 파드당 ~32Mi 라 이 보험은 싸다.
  replicas: 2
  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 새 파드가 커넥터를 등록(Ready)하기 전에는 옛 파드를 안 죽인다.
      maxUnavailable: 0
      maxSurge: 1
      # 그래도 무손실은 아니다. 롤링 4회 × 150요청 실측에서 2회에 각 1건씩 실패했다
      # (0.3%). 내려가는 커넥터로 이미 넘어간 요청은 Cloudflare 가 재시도하지 않는다.
      # 롤링은 이 파일을 고칠 때만 일어나므로 그대로 둔다 — 호스트 launchd 시절의
      # 재시작은 그 자리에서 전면 단절이었다.

  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
      annotations:
        # ConfigMap 만 바꾸면 파드는 안 뜬다(마운트 파일은 갱신되지만 cloudflared 가
        # 다시 읽지 않는다). 체크섬을 넣어 ingress 규칙 변경이 롤링을 유발하게 한다.
        # 값은 config.yml 을 바꿀 때 같이 갱신한다 — `make` 류 자동화는 없다.
        config-revision: "2026-08-22-1"
    spec:
      automountServiceAccountToken: false

      containers:
        - name: cloudflared
          # 호스트에서 돌던 것과 같은 버전(2026.8.2). 자동 업데이트는 끈다 —
          # 굴러가는 버전이 Git 과 달라지면 이 파일이 진실이 아니게 된다.
          image: cloudflare/cloudflared:2026.8.2
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yml
            - --no-autoupdate
            - run

          ports:
            - name: metrics
              containerPort: 2000

          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              # CPU 한도는 안 둔다. 프록시라 스로틀링이 곧 사용자 지연이다.
              memory: "128Mi"

          # /ready 는 등록된 커넥터가 하나 이상일 때만 200 이다.
          # maxUnavailable: 0 과 짝이라, 이게 200 이 되기 전엔 옛 파드가 안 죽는다.
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 30
            periodSeconds: 30
            # 재시작으로 고쳐지는 것만 본다. Cloudflare 쪽 일시 장애로 커넥터가
            # 잠깐 빠지는 것까지 재시작으로 대응하면 오히려 복구가 늦어진다.
            failureThreshold: 5

          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared-creds
              readOnly: true

      # cloudflared 는 SIGTERM 을 받으면 진행 중인 요청을 흘려보내고 커넥터를 내린다.
      # 기본 grace-period 30초 위에 여유를 둔다.
      terminationGracePeriodSeconds: 45

      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-credentials
            # 0400 이면 안 된다. 소유자가 root 인데 이 이미지는 nonroot(65532)로 돌아
            # `permission denied` 로 CrashLoopBackOff 한다. 앱 파드(nar-*)는 root 라
            # 0400 이 통하지만 여기는 다르다. 컨테이너가 하나뿐이라 0444 로 잃는 게 없다.
            defaultMode: 0444
