# Prometheus 가 kubelet 내장 cAdvisor 를 긁을 수 있게 하는 자격증명(권한 쪽만).
#
# ## 왜 kubelet 인가
#
# `kube-state-metrics` 는 **limit 만** 안다. 실사용 메모리는 모른다.
# "천장까지 몇 % 왔나"를 알려면 둘이 다 필요하다:
#
#   container_memory_working_set_bytes         ← 여기(kubelet cAdvisor)
#   kube_pod_container_resource_limits         ← kube-state-metrics
#
# OOM 은 초 단위로 터진다. 사후에 "왜 죽었나"를 아는 것과 **터지기 전에 램프를 보는 것**은
# 다른 문제고, 후자에는 실사용 곡선이 필요하다. 2026-09-06 사고는 17:12~17:20 에
# 8분간 램프가 있었다 — 곡선이 있었으면 그때 알림이 갔다.
#
# ## 왜 토큰 Secret 이 이 파일에 없나
#
# ArgoCD 가 `infra/k8s` 를 `prune: true` + 클라이언트 사이드 apply 로 맞춘다.
# 토큰 Secret 을 여기 두면 desired 의 `data` 가 비어 있어서 컨트롤러가 채워 넣은
# 토큰과 계속 부딪힌다. 그래서 **Secret 은 서버에서 손으로 한 번 만든다.**
#
#   kubectl -n nar apply -f - <<'EOF'
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: prometheus-kubelet-token
#     namespace: nar
#     annotations:
#       kubernetes.io/service-account.name: prometheus-kubelet
#   type: kubernetes.io/service-account-token
#   EOF
#
#   # 토큰을 Prometheus 가 읽는 자리로 꺼낸다 (만료 없음 — `create token` 은 만료가 있어 못 쓴다)
#   kubectl -n nar get secret prometheus-kubelet-token \
#     -o jsonpath='{.data.token}' | base64 -d > ~/monitoring/kubelet-token
#   chmod 600 ~/monitoring/kubelet-token
#   docker restart prometheus
#
# 이 절차는 `infra/monitoring/README.md` 에도 적어 뒀다. 파일이 없으면 docker 가
# 그 자리에 **디렉토리를 만들어** Prometheus 가 조용히 인증 실패한다 — 먼저 만들 것.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-kubelet
  namespace: nar
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-kubelet-reader
rules:
  # **`nonResourceURLs: ["/metrics/cadvisor"]` 가 아니다.** 처음에 그렇게 짰다가 403 을 밟았다.
  #
  # kubelet 은 자기 인가를 API 서버에 웹훅으로 위임하는데, 그때 요청을 경로가 아니라
  # **리소스 속성**으로 번역한다 — `nodes/metrics`, verb `get`. nonResourceURL 규칙은
  # API 서버 자신의 `/metrics` 를 위한 것이고 kubelet 은 그걸 보지 않는다.
  #
  # 실측으로 확인한다(2026-09-08). 판정은 `kubectl auth can-i` 로 하지 말 것 —
  # `nodes` 가 클러스터 스코프라 네임스페이스 맥락에서 물으면 오탐으로 no 가 나온다.
  # 진짜 검증은 kubelet 을 직접 찌르는 것이다:
  #
  #   TOK=$(cat ~/monitoring/kubelet-token)
  #   colima ssh -- curl -sk -H "Authorization: Bearer $TOK" \
  #     https://172.17.0.1:10250/metrics/cadvisor | head
  #
  #   nonResourceURLs 였을 때 → 403 / nodes/metrics 로 바꾼 뒤 → 200
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-kubelet-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-kubelet-reader
subjects:
  - kind: ServiceAccount
    name: prometheus-kubelet
    namespace: nar
