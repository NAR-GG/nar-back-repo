# nginx(맥OS 호스트)가 파드에 닿는 통로.
#
# 호스트는 클러스터 밖이라 ClusterIP 로는 못 간다. NodePort 를 열면 Lima 가
# VM 의 리스닝 포트를 호스트로 포워딩해 주고, nginx 는 127.0.0.1:30081 로 붙는다.
#
# 포트를 고정한 이유: nginx upstream 설정에 숫자를 박아야 하는데, 자동 할당이면
# 서비스를 다시 만들 때마다 번호가 바뀌어 nginx 가 조용히 502 를 낸다.
#
# 30080·30443 은 ArgoCD 가 쓰고 있다.
#
# 지금은 nginx 가 아직 docker 컨테이너(8083)를 가리킨다. 이 Service 는 만들어만 두고
# 트래픽은 안 받는다 — 전환은 nginx upstream 을 바꾸는 별도 단계다.
apiVersion: v1
kind: Service
metadata:
  name: nar-web
  namespace: nar
spec:
  type: NodePort
  selector:
    app: nar-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
