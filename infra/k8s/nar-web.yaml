# 웹 파드. 실트래픽을 받는다 (헤더가 "아직 안 받는다" 라고 거짓말하고 있었다 — 전환은 끝났다).
#   Cloudflare → 호스트 cloudflared → 127.0.0.1:30082 → Traefik(NodePort) → 이 파드
# 라우팅은 traefik-routes.yaml, Service 는 nar-web-service.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nar-web
  namespace: nar
spec:
  replicas: 1
  # 롤백은 Git 으로 한다(옛 SHA 재배포). kubectl rollout undo 를 쓸 일이 없으므로
  # 옛 ReplicaSet 이력을 기본값 10개나 쌓아둘 이유가 없다 — ArgoCD 트리만 어지럽힌다.
  revisionHistoryLimit: 3

  # 무중단 배포. 기본값 25%/25% 로도 replicas 1 에서는 올림·내림이 맞아떨어져
  # 같은 결과가 나오지만, 무중단을 반올림 규칙에 맡기고 있었다.
  # replicas 를 건드리는 순간 조용히 깨지는 종류의 의존이라 숫자로 못박는다.
  #
  # ⚠️ maxSurge 0 으로 바꾸면 유일한 파드가 먼저 죽어 다운타임이 생긴다.
  #    스케줄러(nar-scheduler.yaml)와 달리 여기는 Recreate 를 쓰면 안 된다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nar-web
  template:
    metadata:
      labels:
        app: nar-web
    spec:
      # 이걸 켜두면 쿠버네티스가 서비스어카운트 토큰을
      # /var/run/secrets/kubernetes.io/serviceaccount 에 마운트한다.
      # /var/run 은 /run 심링크라, 아래에서 /run/secrets 를 읽기 전용으로 마운트하면
      # 그 안에 디렉토리를 못 만들어 컨테이너가 아예 안 뜬다(CrashLoopBackOff).
      #
      #   mkdirat .../run/secrets/kubernetes.io: read-only file system
      #
      # 앱은 쿠버네티스 API 를 쓰지 않으므로 토큰이 필요 없다. 꺼서 경로 충돌을 없앤다.
      # (docker 와 같은 /run/secrets 경로를 유지하려는 것 — 경로를 바꾸면 시크릿의
      #  GOOGLE_APPLICATION_CREDENTIALS·APNS_KEY_PATH 도 같이 고쳐야 한다)
      automountServiceAccountToken: false

      containers:
        - name: app
          image: menten4859/nar-gg:59870c1d502c04169f39926b4561e32c3a5ef771
          ports:
            - containerPort: 8080

          envFrom:
            - secretRef:
                name: nar-env

          env:
            # 시크릿 안의 DB_URL 은 docker 판에서 복사해온 값이라 host.docker.internal 이다.
            # 파드에서는 그 이름이 안 풀린다. 맥OS 호스트는 Colima 네트워크의 192.168.5.2 다.
            # 여기서 덮어쓰므로 시크릿 쪽 값은 파드에 영향이 없다.
            - name: DB_URL
              value: "jdbc:mysql://192.168.5.2:3306/nardb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"

            # 스케줄러는 이제 이 파드에서 돌지 않는다. nar-scheduler.yaml 이 전담한다.
            #
            # 나눈 이유는 두 가지다. 웹을 늘리고 싶어도 못 늘렸다 — 복제본을 2로 올리면
            # 라이브 폴링과 푸시가 두 벌 돌아 사용자에게 알림이 두 번 간다(중복 실행 가드가 없다).
            # 그리고 웹을 배포할 때마다 스케줄러가 같이 재시작해 라이브 폴링에 구멍이 났다.
            #
            # ⚠️ 스케줄러가 도는 파드는 언제나 정확히 하나여야 한다. 이 값을 true 로 되돌리면
            #    nar-scheduler 와 겹쳐 이중 발송이 된다.
            - name: APP_SCHEDULING_ENABLED
              value: "false"

            # 푸시·Flyway·Sentry 는 시크릿(nar-env)의 원래 값을 그대로 쓴다.

            # JAVA_TOOL_OPTIONS 는 시크릿 값을 쓰면 안 된다. 시크릿에는 docker 시절
            # 값(-Dwhatap.oname=nar-gg-green 등)이 박혀 있어 여기서 덮는다.
            #
            # ── WhaTap: 이번 달까지만 ──
            # 월말 해지 때 이 값에서 -javaagent 와 -Dwhatap.oname 을 지우고,
            # 아래 whatap 볼륨(volumeMounts·volumes)도 함께 걷어낸다.
            # 에이전트 jar 는 hostPath(~/nar/whatap)에 있고 oname 만 파드용으로 바꿨다.
            #
            # ── Xmx 는 2g 였다 (2026-08-23 롤아웃 OOMKilled 2건) ──
            # 근거 없는 숫자였다. Prometheus 7일 실측:
            #   live data(풀GC 후 생존)  453 MiB
            #   힙 커밋 최대            1424 MiB   ← 2g 라 G1 이 GC 대신 힙을 늘렸다
            #   할당률 13.2 MiB/s, GC overhead 1.1%, 정지시간 0.027%
            # 1024m 은 생존의 2.3배. eden 571 MiB 라 young GC 는 43초마다 = 1.4회/분으로
            # 지금(2.57회/분)보다 오히려 덜 돈다 — 힙이 자주 430M 로 쪼그라들어 있어서다.
            #
            # ⚠️ 1.5g·1.7g 로 낮추는 건 무의미하다. 관측 최대 커밋 1424 MiB 가 그 아래라
            #    캡이 안 걸린다. 죽던 순간 anon-rss 1777 MiB(=힙 커밋 약 1235)도 마찬가지다.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx1024m -javaagent:/whatap/whatap.agent-2.2.77.jar -Dwhatap.oname=nar-web --add-opens=java.base/java.lang=ALL-UNNAMED"

            # 롤링 교체에서 옛 파드가 SIGTERM 을 받는 순간 Tomcat 이 처리 중이던
            # 커넥션을 끊어 502 가 난다(#422 검증 배포에서 실제로 관측).
            # graceful 이면 새 요청만 거절하고 진행 중인 요청은 마저 처리한다.
            - name: SERVER_SHUTDOWN
              value: "graceful"

            # 솔랭 종료 알림(#394). 시크릿(nar-env)은 docker 시절 값이라 이 키가 없고,
            # GitHub Actions 변수로 켜둔 값은 옛 docker run 배포 경로에만 먹는다.
            # 그래서 파드에서는 application.yml 기본값 false 로 떨어져
            # 사용자가 앱에서 종료 알림을 켜도(현재 16구독) 전이 감지조차 안 됐다.
            - name: SOLO_RANK_END_NOTIFICATION_ENABLED
              value: "true"

            # 스트리머 모드 계정용 match-v5 폴백. 이 계정들은 Spectator API 가 막혀
            # 라이브 감지가 원천 불가라, 켜기 전까지는 시작도 종료도 알림이 하나도 안 나갔다
            # (예: PerfecT#132 / player 133 — 구독해도 아무것도 못 받는 상태였다).
            # 켜면 종료 후 match-v5 로 뒤늦게 잡아 "한 판을 마쳤어요" 를 보낸다.
            #
            # prod 에서 한 번도 안 돌아본 경로라 그동안 닫아 뒀다. 부하와 안전장치는 실측했다:
            #   - 추적 계정 101개 × 5분 주기 = 사이클당 매치목록 조회 101회
            #   - 개별 매치 조회는 라이브 모니터와 같은 기록 테이블로 중복 방지되어(exists)
            #     이미 10,552건이 쌓인 지금은 대부분 스킵된다
            #   - 첫 실행에 새로 적재되는 옛 경기는 alert-freshness-minutes(60) 게이트에
            #     걸려 알림이 안 나간다 — 과거 경기 스팸이 나지 않는 이유다
            - name: RIOT_MATCH_FALLBACK_ENABLED
              value: "true"

          resources:
            # RSS 구성식 (실측 검산: 1583Mi = 힙커밋 1041 + 논힙 339 + 기타 203)
            #   힙 커밋 상한          1024Mi   (-Xmx1024m)
            #   논힙 커밋              339Mi   (메타스페이스 201 + 코드힙 119 + 클래스 24)
            #   스레드(94개)·GC구조·malloc  203Mi
            #   ────────────────────────────
            #   worst-case             1566Mi
            #
            # 2026-08-23 OOM 은 cgroup 한도 초과가 아니라 VM 전역 고갈이었다
            # (dmesg: `constraint=CONSTRAINT_NONE ... global_oom`). 그래서 한도를 만지는 게
            # 아니라 **실사용량 자체**를 줄이는 게 고침이다 — 그건 위 Xmx 가 한다.
            # 여기 숫자는 장부를 실측에 맞추는 일이다.
            #
            # Guaranteed QoS(oom_score_adj -997)로 만들 수도 있지만 그러려면 CPU 에도
            # limits 를 걸어야 한다(메모리만 맞춰선 Burstable 그대로다). CPU 한도는
            # 스로틀링이라 기동과 GC 를 느리게 만든다 — 새 위험을 사서 보험을 드는 꼴이라 안 한다.
            requests:
              # 실측 정상 RSS(1583Mi) 근처. 스케줄링 기준이므로 평상시 값으로 잡는다.
              memory: "1600Mi"
              cpu: "500m"
            limits:
              # worst-case 1566Mi 에 모델 오차분을 얹었다. 1600Mi 로 바짝 조이면
              # 추정이 조금만 빗나가도 cgroup OOMKill 이라 여유를 남긴다.
              # 그래도 옛 3Gi 대비 천장이 1/3 낮아져 서지(2파드) 피크가 확 줄어든다.
              memory: "2Gi"
              # CPU 한도는 두지 않는다. 한도는 스로틀링이라, 여유가 있어도 GC 와 기동이 느려진다.

          # docker 판에 없던 것. 프로세스는 살아 있는데 응답을 못 하는 상태를
          # `--restart unless-stopped` 는 못 잡는다(프로세스가 죽어야 반응).
          readinessProbe:
            httpGet:
              path: /api/worlds/recent
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/worlds/recent
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3

          # SIGTERM 과 동시에 Service 엔드포인트에서 빠지는 게 아니다 — 제거가
          # kube-proxy 에 전파되는 데 몇 초 걸리고, 그동안 새 요청이 죽어가는
          # 파드로 온다. SIGTERM 을 잠깐 늦춰 전파가 끝난 뒤 종료를 시작한다.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]

          # docker 판이 -v 로 넣어주던 파일들. 경로는 docker 와 똑같이 맞췄다
          # (GOOGLE_APPLICATION_CREDENTIALS·APNS_KEY_PATH 가 시크릿에 그 값으로 들어 있다).
          #
          # 이게 없으면 FIREBASE_MESSAGING_ENABLED=true 인 순간 FirebaseApp 빈이
          # 파일을 못 찾아 기동에 실패한다. 스케줄러를 켤 때 크래시루프로 나타난다.
          volumeMounts:
            - name: files
              mountPath: /run/secrets
              readOnly: true
            # WhaTap 에이전트 (이번 달까지 — JAVA_TOOL_OPTIONS 주석 참고).
            # 에이전트가 logs/ 에 쓰므로 readOnly 로 걸면 기동은 되는데 조용히 로그만 못 쓴다.
            - name: whatap
              mountPath: /whatap

      volumes:
        - name: files
          secret:
            secretName: nar-files
            defaultMode: 0400
        # k3s 노드는 Colima VM 이다. VM 이 /Users/changha 를 마운트하고 있어
        # 이 hostPath 가 맥 호스트의 ~/nar/whatap 으로 닿는다(실측 확인).
        - name: whatap
          hostPath:
            path: /Users/changha/nar/whatap
            type: Directory
