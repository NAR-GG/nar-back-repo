# 스케줄러 파드. 웹과 같은 이미지를 쓰고 APP_SCHEDULING_ENABLED 로만 역할이 갈린다.
# 코드를 나누지 않은 이유는 스위치가 이미 있기 때문이다 — SchedulerConfig 가
# app.scheduling.enabled 로 모든 @Scheduled 등록을 좌우한다.
#
# ⚠️ 잡을 돌리는 파드는 언제나 정확히 하나다 — 물리가 아니라 리더 리스(scheduler_lease,
#    #473)가 보장한다. 롤아웃 겹침 동안 두 파드가 떠 있어도 리더만 잡 본문을 실행한다.
#    APP_SCHEDULING_LEASE_ENABLED 를 끄면 이 보장이 사라지므로 strategy 도 Recreate 로
#    되돌려야 한다 — 아래 strategy 주석 참고.
#
# 트래픽은 안 받는다. Service(nar-web)의 셀렉터가 app: nar-web 이라 이 라벨은 안 걸린다.
#
# ⚠️ 폴링이 채우는 인메모리 상태(LiveStateStore, startNotifiedGameIds)는 이 파드에만 있다.
#    nar-web 은 같은 빈을 갖지만 영구히 빈 상태다 — 웹 요청 경로에서 그걸 읽는 코드는
#    DB 폴백이 없으면 조용히 무동작이 된다. docs/adr/0002-scheduler-pod-split.md 참고.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nar-scheduler
  annotations:
    # 웹(wave 0)이 Healthy 가 된 뒤에 교체한다. 동시 surge 를 막아 롤아웃 피크를 파드 3개로
    # 묶는다 — 이 값을 지우면 웹과 같이 교체돼 4개가 된다.
    argocd.argoproj.io/sync-wave: "1"
  namespace: nar
spec:
  replicas: 1
  revisionHistoryLimit: 3

  # RollingUpdate + 리더 리스(#473, scheduler_lease). 롤아웃 순서:
  #   새 파드가 뜬다(maxSurge 1) → 리스가 잡혀 있어 잡 본문은 건너뛰며 대기(warm standby)
  #   → Ready 가 되면 k8s 가 옛 파드를 죽인다 → 옛 파드가 @PreDestroy 에서 리스를 반납
  #   → 새 파드가 다음 갱신 주기(≤5초)에 리더를 이어받는다.
  # 폴링 공백이 Recreate 의 38~48초에서 ~5-15초로 준다. 겹침 구간의 이중 실행은 리스 게이트가
  # 막고, 혹시 새는 발송도 전부 DB 멱등이다(FCM delivery, 카드 V75, 워터마크 V76).
  #
  # ⚠️ 리스 없이 이 전략을 쓰면 안 된다 — maxSurge 겹침 동안 라이브 폴링·푸시가 두 벌 돈다.
  #    APP_SCHEDULING_LEASE_ENABLED 를 끄려면 이 전략도 Recreate 로 되돌려야 한다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: nar-scheduler
  template:
    metadata:
      labels:
        app: nar-scheduler
    spec:
      # nar-web 과 같은 이유다. /run/secrets 를 읽기 전용으로 마운트하는데
      # 토큰 마운트가 그 아래에 디렉토리를 만들려다 실패해 파드가 안 뜬다.
      automountServiceAccountToken: false

      containers:
        - name: app
          image: menten4859/nar-gg:59870c1d502c04169f39926b4561e32c3a5ef771
          ports:
            - containerPort: 8080

          envFrom:
            - secretRef:
                name: nar-env

          env:
            # 시크릿의 DB_URL 은 docker 시절 host.docker.internal 이라 파드에서 안 풀린다.
            - name: DB_URL
              value: "jdbc:mysql://192.168.5.2:3306/nardb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"

            - name: APP_SCHEDULING_ENABLED
              value: "true"
            # 리더 리스(scheduler_lease 테이블). 위 strategy(RollingUpdate)의 전제다 —
            # 이걸 끄려면 strategy 도 Recreate 로 같이 되돌려야 한다(파일 상단 주석 참고).
            # 첫 핸드오버 실측 2026-08-23: 리더 공백 4초, 폴링 공백 ~6-15초, 이중 실행 0.
            - name: APP_SCHEDULING_LEASE_ENABLED
              value: "true"

            # WhaTap 을 안 붙인다. 이번 달 해지 예정이라 새 파드에 새 oname 을 등록할
            # 이유가 없고, 에이전트 하나만큼 메모리를 아낀다. 웹 파드에는 아직 남아 있다.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx1200m --add-opens=java.base/java.lang=ALL-UNNAMED"

            - name: SERVER_SHUTDOWN
              value: "graceful"

            # 웹과 같은 값. 둘 중 하나라도 빠지면 해당 알림 경로가 조용히 죽는다.
            - name: SOLO_RANK_END_NOTIFICATION_ENABLED
              value: "true"
            - name: RIOT_MATCH_FALLBACK_ENABLED
              value: "true"

            # 앱스토어 신규 리뷰 폴링 → 디스코드. 여기만 있으면 된다 — @Scheduled 는
            # 스케줄러 파드에서만 돈다. 배포 알림은 웹훅이라 웹 파드가 받는다(플래그 없음).
            #
            # ASC 키(4H45HYAFAQ)로 /v1/apps·customerReviews 를 직접 호출해 200 을 확인하고,
            # 시크릿 6개를 nar-env 에 봉인한 뒤 켰다. 첫 폴링은 씨딩만 하고 발송하지 않으므로
            # (AppStoreReviewMonitor) 켜는 순간 과거 리뷰가 쏟아지지 않는다 — 두 번째 주기부터 신규만.
            - name: APP_STORE_REVIEW_MONITOR_ENABLED
              value: "true"

            # 플레이스토어 리뷰·출시 폴링. 2026-09-02 실호출로 확인하고 켰다 —
            # warding-monitor@gen-lang-client-0887649677 로 reviews 200(2건),
            # edits.insert 200 → tracks/production 200(versionCode 50) → delete 204.
            #
            # 리뷰와 출시를 따로 두는 이유는 필요 권한이 달라서다. 출시는 edits.insert 를
            # 부르므로(트랙 조회 전용 경로가 없다) 서비스 계정에 출시 권한이 없으면 403 이고,
            # 그때 리뷰만 켜고 갈 수 있어야 한다.
            - name: PLAY_REVIEW_MONITOR_ENABLED
              value: "true"
            - name: PLAY_RELEASE_MONITOR_ENABLED
              value: "true"

          resources:
            requests:
              memory: "1300Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              # 웹과 달리 CPU 한도를 둔다. CSV 인제스트가 JDBC 4 스레드로 도는데,
              # 같은 VM 의 웹 파드를 굶기면 안 된다. 스케줄 잡은 몇 초 늦어도 되고
              # 사용자 요청은 안 된다.
              cpu: "2500m"

          # 트래픽을 안 받으니 readiness 는 배포 진행 판정용이다. Recreate 는 새 파드가
          # Ready 가 될 때까지 배포를 완료로 보지 않는다.
          #
          # 경로가 웹(/api/worlds/recent)과 다른 이유: liveness 가 DB 를 타면 안 된다.
          # DB 가 죽었을 때 파드를 재시작해도 DB 는 안 살아나고, 재기동한 파드가 또
          # 같은 이유로 죽어 무한 재시작이 된다. 앱은 멀쩡한데 겉보기가 앱 크래시라
          # 진짜 원인을 가린다. liveness 는 재시작으로 고쳐지는 것만 봐야 한다.
          # 스프링의 liveness/readiness 그룹은 DB 헬스를 포함하지 않는다.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          # 푸시·구글 드라이브 자격증명. 스케줄러가 실제로 발송하는 쪽이라
          # 이게 없으면 FirebaseApp 빈이 파일을 못 찾아 기동에서 실패한다.
          volumeMounts:
            - name: files
              mountPath: /run/secrets
              readOnly: true

      volumes:
        - name: files
          secret:
            secretName: nar-files
            defaultMode: 0400
