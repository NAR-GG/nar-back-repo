name: Build and Deploy Spring Boot to EC2 with Secrets Injection

on:
  # 2026-08-17 컷오버로 실서비스가 맥미니로 옮겨갔다. 자동 배포는
  # deploy-macmini.yml 이 담당하고, 이 워크플로는 롤백용 수동 전용으로 남긴다.
  # EC2 를 해지하면 이 파일도 지운다.
  workflow_dispatch:

# 배포는 한 번에 하나만 돈다.
#
# 배포 스크립트는 nar-upstream.conf 에서 ACTIVE_PORT 를 읽어 그 반대편에 새 컨테이너를 띄운다.
# 두 실행이 겹치면 둘 다 같은 ACTIVE_PORT 를 읽어 같은 포트·같은 컨테이너 이름을 고르고,
# 한쪽의 백그라운드 정리(docker stop OLD_NAME)가 다른 쪽이 방금 트래픽을 넘긴 컨테이너를
# 죽인다. 블루-그린이 무중단인 것은 순차 실행을 전제로 하기 때문이다.
#
# cancel-in-progress 는 false 여야 한다. 진행 중인 배포를 중간에 끊으면 새 컨테이너는
# 떠 있는데 upstream 은 옛 것을 가리키는 어정쩡한 상태로 남는다. 취소가 아니라 대기다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies  # Gradle 캐싱
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create service-account-key.json from Secrets and move to resources
        run: |
          cat <<EOF > service-account-key.json
          ${{ secrets.SERVICE_ACCOUNT_KEY }}
          EOF
          mkdir -p src/main/resources  
          mv service-account-key.json src/main/resources/service-account-key.json  
          ls -la src/main/resources  

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # 서버는 t4g(arm64) 고정 — arm64만 빌드해 배포 시간을 줄인다.
          # Dockerfile에 RUN이 없어(레이어 조립뿐) QEMU 에뮬레이터도 불필요.
          # RUN 스텝을 추가하거나 amd64 인스턴스로 옮기면 QEMU/amd64를 되살릴 것.
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/nar-gg:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/nar-gg:${{ github.sha }}

      # 별도 잡으로 분리하면 러너 기동 비용(~15초)이 추가되므로 같은 잡에서 이어서 배포한다.
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          # iOS Live Activity 푸시용 APNs .p8 (base64). 비어 있으면 설치·마운트를 건너뛰고
          # APNS_ENABLED 가 false 로 남아 발송 경로 전체가 skip 된다.
          APNS_KEY_BASE64: ${{ secrets.APNS_KEY_BASE64 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: FIREBASE_SERVICE_ACCOUNT_BASE64,APNS_KEY_BASE64,APNS_KEY_ID,APNS_TEAM_ID
          script: |
            set -eu

            APP_IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/nar-gg:${{ github.sha }}"
            FIREBASE_SECRET_DIR="/opt/nar/secrets"
            FIREBASE_SECRET_FILE="${FIREBASE_SECRET_DIR}/firebase-service-account.json"

            : "${FIREBASE_SERVICE_ACCOUNT_BASE64:?FIREBASE_SERVICE_ACCOUNT_BASE64 secret is required}"

            echo "Installing Firebase service account..."
            sudo install -d -m 700 "${FIREBASE_SECRET_DIR}"
            printf '%s' "${FIREBASE_SERVICE_ACCOUNT_BASE64}" \
              | base64 --decode \
              | sudo tee "${FIREBASE_SECRET_FILE}" > /dev/null
            sudo chmod 600 "${FIREBASE_SECRET_FILE}"

            # iOS Live Activity 용 APNs 인증 키(.p8).
            # 키가 아직 없으면 시크릿이 비어 있고, 그러면 설치·마운트를 건너뛴 채
            # APNS_ENABLED=false 로 떠서 기존 배포와 동작이 같다(발송 경로 전체 skip).
            # APNS_PUSH_TO_START_ENABLED 는 서버가 잠금화면 카드를 새로 만드는 별도 스위치다
            # (#351 에서 기본 OFF 로 머지). 앱이 push-to-start 토큰을 올리기 시작해 켠다.
            APNS_SECRET_FILE="${FIREBASE_SECRET_DIR}/apns-auth-key.p8"
            APNS_MOUNT_ARGS=""
            APNS_ENV_ARGS=""
            if [ -n "${APNS_KEY_BASE64:-}" ]; then
              echo "Installing APNs auth key..."
              printf '%s' "${APNS_KEY_BASE64}" \
                | base64 --decode \
                | sudo tee "${APNS_SECRET_FILE}" > /dev/null
              sudo chmod 600 "${APNS_SECRET_FILE}"
              APNS_MOUNT_ARGS="-v ${APNS_SECRET_FILE}:/run/secrets/apns-auth-key.p8:ro"
              APNS_ENV_ARGS="-e APNS_ENABLED=true \
                -e APNS_KEY_PATH=/run/secrets/apns-auth-key.p8 \
                -e APNS_KEY_ID=${APNS_KEY_ID:-} \
                -e APNS_TEAM_ID=${APNS_TEAM_ID:-} \
                -e APNS_BUNDLE_ID=com.nar.wardingapp \
                -e APNS_PUSH_TO_START_ENABLED=true"
            else
              echo "APNS_KEY_BASE64 not set — Live Activity 푸시 비활성 상태로 배포합니다."
              sudo rm -f "${APNS_SECRET_FILE}"
            fi

            echo "Checking disk usage before cleanup..."
            df -h
            docker system df || true

            # 이미지/빌더 prune 은 배포 성공 후로 미룬다(하단 백그라운드 정리).
            # pull 전에 이미지를 지우면 temurin 베이스(~450MB)까지 매번 재다운로드되므로,
            # 기존 이미지를 남겨 베이스 레이어를 공유하고 바뀐 앱 레이어만 받게 한다.
            echo "Cleaning up stopped containers..."
            docker container prune -f || true

            # 1. 메인 Spring Boot 앱 blue/green 배포
            # nginx upstream(/etc/nginx/conf.d/nar-upstream.conf)이 가리키는 포트의 반대편에
            # 새 컨테이너를 띄우고, 헬스체크 통과 후 upstream을 교체한다.
            # 헬스체크 실패 시 구 컨테이너가 그대로 남아 롤백이 필요 없다.
            UPSTREAM_CONF="/etc/nginx/conf.d/nar-upstream.conf"
            ACTIVE_PORT=$(grep -oE '127\.0\.0\.1:[0-9]+' "${UPSTREAM_CONF}" | cut -d: -f2)

            if [ "${ACTIVE_PORT}" = "8080" ]; then
              NEW_PORT=8083; NEW_NAME=nar-gg-green; OLD_NAME=nar-gg-blue
            else
              NEW_PORT=8080; NEW_NAME=nar-gg-blue; OLD_NAME=nar-gg-green
            fi
            echo "Active port: ${ACTIVE_PORT} -> deploying ${NEW_NAME} on ${NEW_PORT}"

            # 이전 배포 실패 잔재 정리
            docker rm -f "${NEW_NAME}" 2>/dev/null || true

            echo "Pulling app image: ${APP_IMAGE}"
            docker pull "${APP_IMAGE}"

            # WhaTap Java APM — 에이전트·whatap.conf는 호스트 /opt/whatap 에 사전 설치.
            # 최신 jar 자동 선택하므로 에이전트 업데이트는 tar만 다시 풀면 된다.
            WHATAP_JAR=$(basename "$(ls /opt/whatap/whatap.agent-*.jar | sort -V | tail -1)")

            # awslogs: CloudWatch /nar/app 로 전송 (보존 30일). docker 20.10+ dual logging
            # 캐시 덕에 docker logs·Dozzle 도 그대로 동작한다. EC2 롤: NAR-CloudWatch-Role
            docker run -d --name "${NEW_NAME}" -p 127.0.0.1:${NEW_PORT}:8080 \
              --restart unless-stopped \
              -m 1536m \
              --log-driver=awslogs \
              --log-opt awslogs-region=ap-northeast-2 \
              --log-opt awslogs-group=/nar/app \
              --log-opt awslogs-create-group=true \
              -e SPRING_PROFILES_ACTIVE="prod" \
              -e DISCORD_WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK_URL }}" \
              -e SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
              -e SENTRY_RELEASE="${{ github.sha }}" \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e ELASTICSEARCH_URI="${{ secrets.ELASTICSEARCH_URI }}" \
              -e GOOGLE_DRIVE_CSV_ID="${{ secrets.GOOGLE_DRIVE_CSV_ID }}" \
              -e YOUTUBE_API_KEY="${{ secrets.YOUTUBE_API_KEY }}" \
              -e LOL_ESPORTS_KEY="${{ secrets.LOL_ESPORTS_KEY }}" \
              -e LOL_SYNC_CRON="0 0/30 * * * *" \
              -e LOL_LIVE_ENABLED="true" \
              -e LOL_TEAM_METADATA_CRON="0 15 4 * * *" \
              -e DISCORD_PLAYER_WEBHOOK_URL="${{ secrets.DISCORD_PLAYER_WEBHOOK_URL }}" \
              -e RIOT_API_KEY="${{ secrets.RIOT_API_KEY }}" \
              -e RIOT_API_ENABLED="true" \
              -e RIOT_MONITOR_ENABLED="true" \
              -e RIOT_MATCH_FALLBACK_ENABLED="${{ vars.RIOT_MATCH_FALLBACK_ENABLED || 'false' }}" \
              -e SOLO_RANK_END_NOTIFICATION_ENABLED="${{ vars.SOLO_RANK_END_NOTIFICATION_ENABLED || 'false' }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}" \
              -e KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}" \
              -e NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}" \
              -e NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}" \
              -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
              -e BACKOFFICE_URL="https://admin.nar.kr" \
              -e CLOUDINARY_CLOUD_NAME="${{ secrets.CLOUDINARY_CLOUD_NAME }}" \
              -e CLOUDINARY_API_KEY="${{ secrets.CLOUDINARY_API_KEY }}" \
              -e CLOUDINARY_API_SECRET="${{ secrets.CLOUDINARY_API_SECRET }}" \
              -e FIREBASE_MESSAGING_ENABLED="true" \
              -e LIVE_NOTIFICATION_FCM_ENABLED="true" \
              -e GOOGLE_APPLICATION_CREDENTIALS="/run/secrets/firebase-service-account.json" \
              -e JAVA_TOOL_OPTIONS="-Xmx768m -javaagent:/whatap/${WHATAP_JAR} --add-opens=java.base/java.lang=ALL-UNNAMED -Dwhatap.oname=${NEW_NAME}" \
              -v "${FIREBASE_SECRET_FILE}:/run/secrets/firebase-service-account.json:ro" \
              -v /opt/whatap:/whatap \
              ${APNS_MOUNT_ARGS} \
              ${APNS_ENV_ARGS} \
              "${APP_IMAGE}"

            # micro+swap 환경은 기동이 느릴 수 있어 상한 120초(60회 x 2초)
            echo "Verifying new container on port ${NEW_PORT}..."
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:${NEW_PORT}/v3/api-docs" | grep -q '"leagues"'; then
                echo "Deployment verification succeeded."
                break
              fi

              if [ "$i" -eq 60 ]; then
                echo "Verification failed. Old container keeps serving traffic (no downtime)."
                docker logs --tail 200 "${NEW_NAME}" || true
                docker rm -f "${NEW_NAME}" || true
                exit 1
              fi

              sleep 2
            done

            # JIT 워밍업 — nginx 전환 전 배포 스크립트가 hot-path 첫 타를 맞아
            # 배포 직후 첫 실유저의 콜드스타트(t3.micro 기준 수 초)를 없앤다.
            # DUMMY gameId·인증 실패라도 디스패치·필터·JPA·직렬화 경로는 데워진다. 실패는 무시.
            echo "Warming up hot endpoints on port ${NEW_PORT}..."
            for ep in champions events ratings; do
              curl -fsS "http://localhost:${NEW_PORT}/api/mobile/live/games/DUMMY/${ep}" -o /dev/null 2>&1 || true
            done

            echo "Switching nginx upstream to ${NEW_PORT}..."
            printf 'upstream nar_backend {\n    server 127.0.0.1:%s;\n}\n' "${NEW_PORT}" \
              | sudo tee "${UPSTREAM_CONF}" > /dev/null
            sudo nginx -t && sudo nginx -s reload

            # 구 컨테이너 정리 + 이미지/빌더 prune 을 백그라운드로 넘긴다.
            # nginx 는 이미 전환됐으므로 graceful stop 35초와 prune 은 사용자 트래픽과 무관 —
            # 배포 워크플로가 여기서 대기할 이유가 없다. nohup 으로 SSH 세션 종료와 분리.
            echo "Cleaning up old container & images in background..."
            nohup bash -c "
              docker stop -t 35 '${OLD_NAME}' 2>/dev/null || true
              docker rm '${OLD_NAME}' 2>/dev/null || true
              docker stop -t 35 nar-gg-container 2>/dev/null || true
              docker rm nar-gg-container 2>/dev/null || true
              docker image prune -af || true
              docker builder prune -af || true
            " >/dev/null 2>&1 &

            # 2. Dozzle — --restart always 라 상시 떠 있으므로 이미지가 갱신됐을 때만 재생성한다.
            echo "Ensuring Dozzle is up to date..."
            docker pull amir20/dozzle:latest
            RUNNING_DOZZLE=$(docker inspect -f '{{.Image}}' dozzle 2>/dev/null || echo none)
            LATEST_DOZZLE=$(docker inspect -f '{{.Id}}' amir20/dozzle:latest 2>/dev/null || echo latest)
            if [ "${RUNNING_DOZZLE}" != "${LATEST_DOZZLE}" ]; then
              echo "Dozzle image changed — recreating..."
              docker stop dozzle || true
              docker rm dozzle || true
              docker run -d --name dozzle --restart always \
                -v /var/run/docker.sock:/var/run/docker.sock:ro \
                -p 127.0.0.1:8082:8080 \
                -e DOZZLE_BASE=/dozzle \
                amir20/dozzle:latest
            else
              echo "Dozzle already on latest image — skipping recreate."
            fi

            echo "Deployment successful!"
