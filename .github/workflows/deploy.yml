name: Build and Deploy Spring Boot to EC2 with Secrets Injection

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies  # Gradle 캐싱
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create service-account-key.json from Secrets and move to resources
        run: |
          cat <<EOF > service-account-key.json
          ${{ secrets.SERVICE_ACCOUNT_KEY }}
          EOF
          mkdir -p src/main/resources  
          mv service-account-key.json src/main/resources/service-account-key.json  
          ls -la src/main/resources  

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/nar-gg:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/nar-gg:${{ github.sha }}
          no-cache: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: FIREBASE_SERVICE_ACCOUNT_BASE64
          script: |
            set -eu

            APP_IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/nar-gg:${{ github.sha }}"
            FIREBASE_SECRET_DIR="/opt/nar/secrets"
            FIREBASE_SECRET_FILE="${FIREBASE_SECRET_DIR}/firebase-service-account.json"

            : "${FIREBASE_SERVICE_ACCOUNT_BASE64:?FIREBASE_SERVICE_ACCOUNT_BASE64 secret is required}"

            echo "Installing Firebase service account..."
            sudo install -d -m 700 "${FIREBASE_SECRET_DIR}"
            printf '%s' "${FIREBASE_SERVICE_ACCOUNT_BASE64}" \
              | base64 --decode \
              | sudo tee "${FIREBASE_SECRET_FILE}" > /dev/null
            sudo chmod 600 "${FIREBASE_SECRET_FILE}"

            echo "Checking disk usage before cleanup..."
            df -h
            docker system df || true

            echo "Cleaning up unused Docker resources..."
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true

            echo "Checking disk usage after cleanup..."
            df -h
            docker system df || true

            # 1. 메인 Spring Boot 앱 배포
            echo "Pulling app image: ${APP_IMAGE}"
            docker pull "${APP_IMAGE}"

            echo "Restarting app container..."
            docker stop nar-gg-container || true
            docker rm nar-gg-container || true
            docker run -d --name nar-gg-container -p 8080:8080 \
              -m 768m \
              -e JAVA_OPTS="-Xmx512m" \
              -e SPRING_PROFILES_ACTIVE="prod" \
              -e DISCORD_WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK_URL }}" \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e ELASTICSEARCH_URI="${{ secrets.ELASTICSEARCH_URI }}" \
              -e GOOGLE_DRIVE_CSV_ID="${{ secrets.GOOGLE_DRIVE_CSV_ID }}" \
              -e YOUTUBE_API_KEY="${{ secrets.YOUTUBE_API_KEY }}" \
              -e LOL_ESPORTS_KEY="${{ secrets.LOL_ESPORTS_KEY }}" \
              -e LOL_SYNC_CRON="0 0/30 * * * *" \
              -e LOL_ACTIVE_LEAGUES="${{ secrets.LOL_ACTIVE_LEAGUES }}" \
              -e LOL_TEAM_METADATA_CRON="0 15 4 * * *" \
              -e DISCORD_PLAYER_WEBHOOK_URL="${{ secrets.DISCORD_PLAYER_WEBHOOK_URL }}" \
              -e RIOT_API_KEY="${{ secrets.RIOT_API_KEY }}" \
              -e RIOT_API_ENABLED="true" \
              -e RIOT_MONITOR_ENABLED="true" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}" \
              -e KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}" \
              -e NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}" \
              -e NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}" \
              -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
              -e CLOUDINARY_CLOUD_NAME="${{ secrets.CLOUDINARY_CLOUD_NAME }}" \
              -e CLOUDINARY_API_KEY="${{ secrets.CLOUDINARY_API_KEY }}" \
              -e CLOUDINARY_API_SECRET="${{ secrets.CLOUDINARY_API_SECRET }}" \
              -e FIREBASE_MESSAGING_ENABLED="true" \
              -e GOOGLE_APPLICATION_CREDENTIALS="/run/secrets/firebase-service-account.json" \
              -v "${FIREBASE_SECRET_FILE}:/run/secrets/firebase-service-account.json:ro" \
              "${APP_IMAGE}"

            echo "Verifying deployed application..."
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/v3/api-docs | grep -q '"leagues"'; then
                echo "Deployment verification succeeded."
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "Deployment verification failed: 'leagues' field not found in OpenAPI spec."
                docker logs --tail 200 nar-gg-container || true
                exit 1
              fi

              sleep 2
            done

            # 2. Dozzle 배포
            echo "Deploying Dozzle..."
            docker pull amir20/dozzle:latest
            docker stop dozzle || true
            docker rm dozzle || true
            docker run -d --name dozzle --restart always \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -p 127.0.0.1:8082:8080 \
              -e DOZZLE_BASE=/dozzle \
              amir20/dozzle:latest
            
            echo "Deployment successful!"
