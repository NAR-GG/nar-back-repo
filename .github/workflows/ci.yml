name: CI

# main 으로 올라오는 PR을 머지 전에 빌드+테스트로 검증한다.
# 트렁크(main)는 항상 배포 가능한 상태를 유지해야 하므로, 이 검증이 통과해야만 머지된다.
on:
  pull_request:
    branches:
      - main

# 같은 PR에서 새 커밋이 푸시되면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 베이스와 diff 를 떠야 해서 전체 이력이 필요하다

      # 코드가 안 바뀐 PR 까지 2분 30초를 쓰고 있었다. 실제로 오늘 올린 PR 9개 중
      # Java 를 건드린 것은 하나뿐이고 나머지는 워크플로·infra·스크립트였다.
      #
      # paths 필터를 쓰지 않는 이유는 required check 때문이다. paths 로 잡을 통째로
      # 건너뛰면 체크가 보고되지 않아 PR 이 "대기 중" 으로 멈춘다. 잡은 항상 돌리고
      # 안쪽 단계만 건너뛴다.
      - name: 코드 변경 여부 판정
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref || 'main' }}...HEAD" \
              | grep -qE '^(src/|build\.gradle|settings\.gradle|gradle\.properties|gradle/|Dockerfile)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "빌드·테스트를 돌린다"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "코드 변경 없음 — 빌드·테스트를 건너뛴다"
          fi

      - name: Set up JDK 17
        if: steps.changed.outputs.code == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        if: steps.changed.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        if: steps.changed.outputs.code == 'true'
        run: chmod +x ./gradlew

      # 컴파일 + 테스트 + 패키징까지 검증한다.
      # 풀컨텍스트 스모크 테스트(NarApplicationTests)는 로컬 시크릿이 필요해
      # -Dfullcontext.local.enabled 미지정 시 자동으로 건너뛴다.
      # MySQL 통합 테스트는 Testcontainers(러너의 Docker)로 구동된다.
      - name: Build and test
        if: steps.changed.outputs.code == 'true'
        run: ./gradlew build

      # 테스트가 통과한 트리로 이미지를 미리 빌드해 둔다. 머지 후 배포 워크플로가
      # main 의 트리 해시와 대조해 바이트 동일하면 registry 레벨 retag 로 재사용한다
      # (풀빌드 ~90초 → ~25초). 트리가 다르면 — 베이스가 낡은 채 머지된 경우 —
      # 배포 워크플로가 알아서 풀빌드로 폴백하므로 정합성은 항상 트리 해시가 보장한다.
      #
      # 태그가 커밋이 아니라 트리 해시인 이유: squash 머지는 커밋 sha 를 새로 만들지만
      # 트리는 (베이스가 안 움직였다면) PR 머지 ref 와 동일하다. 내용 주소화라
      # PR 번호 추적도, 베이스 이동 레이스 분석도 필요 없다.
      - name: Set up Docker Buildx
        if: steps.changed.outputs.code == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.changed.outputs.code == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 트리 해시 계산
        if: steps.changed.outputs.code == 'true'
        id: tree
        run: echo "hash=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: 이미지 선빌드 (머지 후 재사용용)
        if: steps.changed.outputs.code == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/nar-gg:tree-${{ steps.tree.outputs.hash }}

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
