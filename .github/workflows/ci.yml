name: CI

# main 으로 올라오는 PR을 머지 전에 빌드+테스트로 검증한다.
# 트렁크(main)는 항상 배포 가능한 상태를 유지해야 하므로, 이 검증이 통과해야만 머지된다.
on:
  pull_request:
    branches:
      - main

# 같은 PR에서 새 커밋이 푸시되면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 컴파일 + 테스트 + 패키징까지 검증한다.
      # 풀컨텍스트 스모크 테스트(NarApplicationTests)는 로컬 시크릿이 필요해
      # -Dfullcontext.local.enabled 미지정 시 자동으로 건너뛴다.
      # MySQL 통합 테스트는 Testcontainers(러너의 Docker)로 구동된다.
      - name: Build and test
        run: ./gradlew build

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
