name: CI

# main 으로 올라오는 PR을 머지 전에 빌드+테스트로 검증한다.
# 트렁크(main)는 항상 배포 가능한 상태를 유지해야 하므로, 이 검증이 통과해야만 머지된다.
on:
  pull_request:
    branches:
      - main

  # main 에서도 돌린다. setup-gradle 은 기본 브랜치에서 만든 캐시만 다른 브랜치가
  # 읽을 수 있는데, 이 워크플로가 pull_request 에만 걸려 있어 main 캐시가 영영
  # 만들어지지 않았다. 그래서 PR 은 늘 빈 캐시로 돌았다.
  push:
    branches:
      - main

# 같은 PR에서 새 커밋이 푸시되면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # actions/cache 를 직접 쓰면 캐시가 갱신되지 않는다. 키가 정확히 맞으면
      # 실행 끝에 저장을 건너뛰는데, 우리 키는 build.gradle 이 바뀔 때만 변해서
      # 사실상 고정이다. 그래서 매번 같은 스냅샷을 복원만 하고 이번 실행이 만든
      # 빌드 캐시 항목은 버려졌다 — org.gradle.caching=true 가 CI 에서 무효였다.
      #
      # 공식 액션은 build-cache 를 브랜치별로 write-back 해준다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 기본값은 기본 브랜치에서만 캐시를 저장한다. PR 브랜치도 저장하게 해서
          # 같은 PR 에 여러 번 푸시할 때 두 번째부터 이득을 본다.
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 컴파일 + 테스트 + 패키징까지 검증한다.
      # 풀컨텍스트 스모크 테스트(NarApplicationTests)는 로컬 시크릿이 필요해
      # -Dfullcontext.local.enabled 미지정 시 자동으로 건너뛴다.
      # MySQL 통합 테스트는 Testcontainers(러너의 Docker)로 구동된다.
      - name: Build and test
        run: ./gradlew build

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
