name: 스케줄러 배포 따라잡기

# deploy-macmini.yml 이 경기 중이라 보류한 nar-scheduler 태그를, 경기가 없는 시간에 웹 태그로
# 맞춘다. 보류만 있고 이 잡이 없으면 스케줄러가 옛 코드로 무한히 남는다.
#
# 왜 보류가 필요한가 — 스케줄러는 replicas 1 + Recreate 라 원리적으로 무중단이 불가능하다
# (실측 공백 38~48초). 그 공백에 세트 첫 프레임이 떨어지면 그 세트의 시작 알림·라이브위젯이
# 통째로 누락되고 복구 방법이 없다. 웹은 RollingUpdate 라 공백이 0이므로 경기 중에도 안전하다.
#
# 이미지를 새로 빌드하지 않는다. 웹이 이미 쓰고 있는 태그(= 그 SHA 로 빌드된 이미지)를 그대로
# 가리키게만 바꾼다. 그래서 이 잡은 빌드도 도커도 필요 없다.

on:
  schedule:
    # 30분마다. LCK 는 보통 세트 사이 휴식이 15~20분이므로 이보다 촘촘히 볼 이유가 없고,
    # 하루 마지막 경기가 끝나면 늦어도 30분 안에 따라붙는다.
    # cron 은 UTC 다. */30 이라 시차와 무관하다.
    - cron: '*/30 * * * *'
  # 급할 때 손으로 돌린다.
  workflow_dispatch:

concurrency:
  # deploy 브랜치를 강제 푸시하므로 본 배포와 겹치면 안 된다. 같은 그룹을 쓴다.
  group: deploy-macmini
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 트리를 둘로 나눠 받는다.
      #   deploy-tree — 고쳐서 다시 푸시할 대상(이미지 태그가 사는 곳)
      #   main-tree   — 게이트 스크립트를 가져올 곳
      # 왜 나누나: deploy 브랜치는 배포가 돌 때만 갱신되고 `.github/**` 는 paths-ignore 라,
      # 워크플로·스크립트 변경은 deploy 브랜치에 안 들어간다. deploy 트리에서 스크립트를
      # 실행하면 이 잡을 처음 넣는 시점에 "파일이 없다"로 깨진다.
      - uses: actions/checkout@v4
        with:
          ref: deploy
          fetch-depth: 1
          path: deploy-tree

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          path: main-tree

      - name: 태그 차이 확인
        id: diff
        run: |
          set -uo pipefail
          WEB=$(grep -m1 -oE '[^[:space:]]+/nar-gg:[A-Za-z0-9._-]+' deploy-tree/infra/k8s/nar-web.yaml || true)
          SCHED=$(grep -m1 -oE '[^[:space:]]+/nar-gg:[A-Za-z0-9._-]+' deploy-tree/infra/k8s/nar-scheduler.yaml || true)
          echo "web=${WEB}"
          echo "scheduler=${SCHED}"
          if [ -z "$WEB" ] || [ -z "$SCHED" ]; then
            echo "::warning::이미지 줄을 읽지 못했다 — 매니페스트 형식을 확인하라"
            echo "needs_catchup=false" >> "$GITHUB_OUTPUT"
          elif [ "$WEB" = "$SCHED" ]; then
            echo "이미 같다 — 할 일 없음"
            echo "needs_catchup=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_catchup=true" >> "$GITHUB_OUTPUT"
            echo "web_image=${WEB}" >> "$GITHUB_OUTPUT"
          fi

      - name: 경기 진행 여부 확인
        id: gate
        if: steps.diff.outputs.needs_catchup == 'true'
        run: python3 main-tree/.github/scripts/match_window.py

      - name: 스케줄러 태그를 웹에 맞춘다
        if: steps.diff.outputs.needs_catchup == 'true' && steps.gate.outputs.clear == 'true'
        env:
          WEB_IMAGE: ${{ steps.diff.outputs.web_image }}
        working-directory: deploy-tree
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sed -i "s|^\( *image: \).*/nar-gg:.*|\1${WEB_IMAGE}|" infra/k8s/nar-scheduler.yaml
          grep -q "image: ${WEB_IMAGE}$" infra/k8s/nar-scheduler.yaml \
            || { echo "이미지 줄을 못 바꿨다."; exit 1; }

          # force 하지 않는다. 본 배포가 그 사이에 deploy 를 갱신했다면 우리가 읽은 웹 태그가
          # 낡았다는 뜻이므로, 조용히 덮어쓰기보다 실패하고 다음 주기에 다시 보는 게 맞다.
          git commit -am "chore: 보류된 스케줄러 배포 반영 (${WEB_IMAGE##*:})"
          git push origin deploy
          echo "::notice::nar-scheduler 태그를 ${WEB_IMAGE} 로 맞췄다 — ArgoCD 가 파드를 교체한다"
