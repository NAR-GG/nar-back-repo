name: Build and Deploy to 맥미니 홈서버

# GitOps 배포 파이프라인 — CI 는 서버를 만지지 않는다.
#
# 하는 일은 셋뿐이다: 빌드 → 이미지 push → deploy 브랜치에 태그 기록.
# 실제 반영은 맥미니 k3s 의 ArgoCD 가 deploy 브랜치를 보고 파드를 교체한다.
# SSH 도 tailnet 도 필요 없다.
#
# 2026-08-19 스케줄러 이관까지 끝나며 docker 블루-그린 스텝을 걷어냈다.
# 그 전 판이 필요하면 git 히스토리에서 이 파일의 #421 이전 버전을 보라.
# deploy.yml(EC2)은 push 트리거를 떼고 수동 전용으로 남아 있다 — 최후 롤백용.

on:
  push:
    branches:
      - main
    # 문서만 바뀐 머지는 배포를 건너뛴다.
    # infra/ 는 관측 스택·맥미니 설정 원본 보관소다. 서버에 복사해 반영하는 것이지
    # 앱 바이너리와 무관하므로 여기만 바뀌면 빌드도 컨테이너 교체도 할 이유가 없다.
    paths-ignore:
      - 'docs/**'
      - 'infra/**'
      - '**.md'
      # 워크플로만 고쳐도 앱을 새로 빌드해 재배포하고 있었다. 코드가 하나도 안 바뀌었는데
      # 블루-그린 교체까지 일어난다. 워크플로·이슈템플릿 변경은 앱 바이너리와 무관하다.
      #
      # paths-ignore 는 '바뀐 파일이 전부' 이 패턴에 걸릴 때만 건너뛴다. 코드와 섞인
      # 변경은 정상 배포된다.
      - '.github/**'

  # infra/** 만 바뀐 머지를 클러스터에 반영할 때 손으로 돌린다
  # (paths-ignore 에 걸려 자동으로는 안 돈다).
  workflow_dispatch:

# deploy 브랜치를 강제 푸시하므로 두 실행이 겹치면 늦게 끝난 쪽이 이긴다 —
# 오래된 빌드가 새 빌드를 덮을 수 있다. 순차로 강제한다.
concurrency:
  group: deploy-macmini
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # deploy 브랜치에 이미지 태그를 밀기 위해 필요하다. 기본값은 읽기 전용이다.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # PR CI(ci.yml)가 테스트 통과한 트리로 이미지를 미리 밀어 둔다(nar-gg:tree-<해시>).
      # main 의 트리 해시와 바이트 동일한 선빌드가 있으면 registry retag 만 하고
      # 빌드 전체를 건너뛴다 — 머지→배포가 ~90초에서 ~25초로 줄어든다.
      #
      # 트리가 다르면(낡은 베이스로 머지된 경우 등) 아래 풀빌드로 폴백한다.
      # 판정 기준이 커밋이 아니라 "내용(트리)"이므로, 재사용 경로가 잘못된 코드를
      # 배포하는 일은 구조적으로 불가능하다 — 최악이 '느린 배포'다.
      - name: 선빌드 이미지 재사용 판정
        id: reuse
        run: |
          TREE=$(git rev-parse 'HEAD^{tree}')
          echo "tree=${TREE}" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect \
              "${{ secrets.DOCKER_HUB_USERNAME }}/nar-gg:tree-${TREE}" >/dev/null 2>&1; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "선빌드 재사용: tree-${TREE}"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "선빌드 없음 — 풀빌드로 폴백"
          fi

      - name: 선빌드 이미지 retag
        if: steps.reuse.outputs.reuse == 'true'
        run: |
          docker buildx imagetools create \
            -t "${{ secrets.DOCKER_HUB_USERNAME }}/nar-gg:${{ github.sha }}" \
            -t "${{ secrets.DOCKER_HUB_USERNAME }}/nar-gg:latest" \
            "${{ secrets.DOCKER_HUB_USERNAME }}/nar-gg:tree-${{ steps.reuse.outputs.tree }}"

      # ─── 여기부터 풀빌드 폴백 경로 ───

      - name: Set up JDK 17
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 구글 드라이브 키는 더 이상 jar 에 굽지 않는다 — nar-env 시크릿의
      # GOOGLE_SERVICE_ACCOUNT_KEY 로 주입된다(GoogleDriveConfig 가 env 우선).
      # Docker Hub 레포가 public 이라 이미지에 구우면 키가 통째로 노출된다(실사고).
      - name: Build with Gradle
        if: steps.reuse.outputs.reuse != 'true'
        run: chmod +x ./gradlew && ./gradlew clean build -x test

      - name: Set up Docker Buildx
        if: steps.reuse.outputs.reuse != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        if: steps.reuse.outputs.reuse != 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # 맥미니(M1)도 EC2 t4g 와 같은 arm64 다. 이미지가 그대로 재사용된다.
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/nar-gg:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/nar-gg:${{ github.sha }}

      # 맥미니는 Tailscale 안에서만 닿는다. 러너를 tag:ci 짜리 임시 노드로 조인시킨다.
      # ACL 에서 tag:ci 는 맥미니 22 번 포트만 허용된다(DB VM·EC2 에는 못 닿는다).
      # 잡이 끝나면 ephemeral 노드라 자동으로 사라진다.
      #
      # 웹과 스케줄러를 같은 태그로 함께 올린다. 경기 창을 피해 스케줄러 태그를 보류하던
      # 게이트(#470)는 리더 리스 + RollingUpdate(#473, #475)로 걷어냈다 — 스케줄러 교체가
      # 실측 리더 공백 4초·폴링 공백 ~6-15초로 줄어 경기 중에도 무해하다.
      - name: deploy 브랜치에 이미지 태그 기록
        run: |
          set -euo pipefail
          IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/nar-gg:${{ github.sha }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main --depth=1
          git checkout -B deploy FETCH_HEAD

          # 같은 이미지를 쓰는 매니페스트를 전부 갱신한다. 하나만 갈아끼우면 나머지는
          # 옛 태그에 묶인 채 조용히 돌아간다 — 웹은 새 코드, 스케줄러는 옛 코드가 된다.
          # nar-gg 이미지를 쓰는 매니페스트를 새로 추가하면 여기에도 넣어야 한다.
          MANIFESTS=(infra/k8s/nar-web.yaml infra/k8s/nar-scheduler.yaml)

          for MANIFEST in "${MANIFESTS[@]}"; do
            # 태그만 갈아끼운다. 매니페스트의 나머지는 main 그대로다.
            sed -i "s|^\( *image: \).*/nar-gg:.*|\1${IMAGE}|" "${MANIFEST}"

            # sed 가 아무것도 못 바꿨는데 조용히 넘어가면, deploy 브랜치가 낡은 태그를
            # 가리킨 채로 자동 동기화가 돈다. 이미지 줄 형식이 바뀌면 여기서 멈춘다.
            grep -q "image: ${IMAGE}$" "${MANIFEST}" \
              || { echo "이미지 줄을 못 바꿨다. ${MANIFEST} 의 형식을 확인하라."; exit 1; }
          done

          git commit -am "chore: 배포 이미지 ${GITHUB_SHA::7}"
          git push -f origin deploy
          echo "deploy 브랜치 갱신 → ${IMAGE}"
