const DATA = {"name": "NAR OKF", "nodes": [{"id": "overview", "title": "NAR.GG 백엔드", "type": "Project Overview", "description": "LoL e스포츠 분석 서비스의 Spring Boot 백엔드. 웹·모바일 두 프론트에 API를 제공한다.", "resource": "https://github.com/NAR-GG/nar-back-repo", "tags": ["spring-boot", "java", "esports", "lol", "backend"], "body": "# 개요\n\n**NAR.GG**는 LoL(리그 오브 레전드) e스포츠 분석 서비스다. 챔피언 조합, 매치업 통계, 경기 일정, 팀 성적 지표를 추적한다. 이 저장소(`NAR-GG/nar-back-repo`)는 그 **백엔드**로, 두 프론트엔드 — 나르지지 웹 프론트와 [`warding`](https://github.com/NAR-GG/warding-mobile-repo) Flutter 모바일 앱 — 에 공통 API를 제공한다.\n\n# 기술 스택\n\n| 항목 | 내용 |\n|------|------|\n| 프레임워크 | Spring Boot 3.5.3 (Java 17) |\n| DB | MySQL 8 + [JPA/Hibernate](/architecture/persistence.md) |\n| 마이그레이션 | [Flyway](/architecture/persistence.md) (운영 [baseline V30](/operations/db-baseline.md)) |\n| 검색 | Elasticsearch |\n| 캐시 | [Caffeine 2-tier](/architecture/caching.md) |\n| 스케줄링 | [5-thread pool](/architecture/scheduling.md) |\n| 배포 | [GitHub Actions → Docker → EC2](/operations/ci-cd.md) |\n\n# 핵심 규칙 (요약)\n\n- 레이어는 api / app / domain / config / common 으로 나뉜다 → [레이어 구조](/architecture/layered-structure.md)\n- `open-in-view: false` — 명시적 fetch 필수, N+1은 DTO projection으로 회피 → [영속성](/architecture/persistence.md), [컨벤션](/architecture/conventions.md)\n- 마이그레이션은 **멱등**하게, 운영 V1~V30 객체 존재를 가정하지 않는다 → [DB 베이스라인](/operations/db-baseline.md)\n- `main`이 유일한 트렁크, 모든 작업은 단기 브랜치 → main PR (CI 통과 필수) → [브랜치 워크플로](/operations/branch-workflow.md)\n- 자격증명은 전부 환경변수로 주입, 하드코딩 금지 → [환경변수](/operations/environment.md)\n\n# 모듈 영역\n\n도메인 모듈별 상세는 [Modules](/modules/) 참조. 핵심: [lolesports](/modules/lolesports.md), [analysis](/modules/analysis.md), [monitor](/modules/monitor.md), [schedule](/modules/schedule.md), [search](/modules/search.md), [youtube](/modules/youtube.md), [riot](/modules/riot.md), [participant](/modules/participant.md).\n\n# 진행 상황\n\n최신 진행 상황·남은 작업은 [GitHub 프로젝트 보드](/references/github-project.md)와 [CLAUDE.md](/references/claude-md.md)를 단일 출처로 본다. 이 번들엔 진행 상황을 중복 기록하지 않는다.\n\n# Citations\n\n[1] [nar-back-repo (GitHub)](https://github.com/NAR-GG/nar-back-repo)\n[2] [CLAUDE.md](/references/claude-md.md)\n"}, {"id": "references/github-project", "title": "GitHub 프로젝트 보드", "type": "Reference", "description": "NAR-GG/nar 보드 기반 작업 현황. GitHub에서 자동 동기화됨.", "resource": "https://github.com/orgs/NAR-GG/projects/2", "tags": ["reference", "project-board", "issues", "status", "synced"], "body": "# 개요\n\n`gh`로 NAR-GG `nar` 보드에서 자동 생성됨 (최종 동기화: **2026-06-21**). GitHub이 진실(source of truth)이며 이 문서는 단방향 미러다. `python3 nar-okf/sync_github.py`로 갱신한다.\n\n# 🟡 진행 중 (In Progress) (0)\n\n- (없음)\n\n# 🔴 할 일 (Todo) (5)\n\n- #193 📘 [팀 공유] LCK 라이브 기능 개요 — 디스코드 알림 + 모바일 라이브 경기상세 API\n- #192 디스코드 라이브 알림 팀명 진영 스왑 대응\n- #191 라이브 스냅샷 보존정책 + 분당 저장 최적화\n- #190 /events 응답 gzip·캐시 헤더로 egress 절감\n- #189 라이브 수집 리그 제한으로 비용 절감\n\n# ✅ 완료 (Done) (4)\n\n- #200 특정 라이브 게임 강제 reconcile 엔드포인트 추가\n- #199 6시간 Google Drive 배치 동기화 장애 복구 (5/25~)\n- #198 모바일 champions 응답에 배치 밴 데이터 연동\n- #177 → [fix: 클린 체크아웃에서 항상 깨지는 테스트 정리 (H2 폴백 + Flyway V1)](/operations/db-baseline.md)\n\n# Citations\n\n[1] [NAR-GG / nar 보드](https://github.com/orgs/NAR-GG/projects/2)\n[2] [NAR-GG/nar-back-repo 이슈](https://github.com/NAR-GG/nar-back-repo/issues)\n"}, {"id": "references/claude-md", "title": "CLAUDE.md (개발 가이드)", "type": "Reference", "description": "저장소 루트의 개발 가이드 원본. 아키텍처·규칙·진행 상황의 1차 출처.", "resource": "https://github.com/NAR-GG/nar-back-repo/blob/main/CLAUDE.md", "tags": ["reference", "guide", "source-of-truth"], "body": "# 개요\n\n`CLAUDE.md`는 저장소 루트의 개발 가이드다. 이 번들의 아키텍처·운영·규칙 개념들은 모두 이 문서를 **1차 출처**로 한다.\n\n# 다루는 내용\n\n- 언어 규칙(한국어) / 브랜치 규칙 → [브랜치 워크플로](/operations/branch-workflow.md)\n- 레이어 구조 → [레이어 구조](/architecture/layered-structure.md)\n- 모듈 → [Modules](/modules/)\n- 영속성(JPA·Flyway·ES) → [영속성](/architecture/persistence.md)\n- 캐싱 → [캐싱](/architecture/caching.md)\n- 스케줄링 → [스케줄링](/architecture/scheduling.md)\n- 컨벤션 → [컨벤션](/architecture/conventions.md)\n- 환경변수 → [환경변수](/operations/environment.md)\n- CI/CD → [CI/CD](/operations/ci-cd.md)\n\n# 주의\n\n코드 구조·규칙이 바뀌면 **CLAUDE.md를 먼저 갱신**하고, 이 번들 개념들을 그에 맞춰 동기화한다. 번들은 CLAUDE.md를 대체하지 않고 탐색·연결을 보강한다. 진행 상황·TODO는 [GitHub 보드](/references/github-project.md)와 CLAUDE.md를 단일 출처로 한다.\n\n# 자동 메모리와의 관계\n\n이 레포에는 Claude Code 자동 메모리(`MEMORY.md` 등)도 있다. 메모리는 **에이전트 사적 메모(세션 간 피드백·선호)**, 번들은 **공유 가능한 지식 그래프**다. 역할이 다르므로 같은 사실을 중복 기록하지 않는다.\n\n# Citations\n\n[1] [CLAUDE.md (repo)](https://github.com/NAR-GG/nar-back-repo/blob/main/CLAUDE.md)\n"}, {"id": "playbooks/add-feature", "title": "새 기능 추가", "type": "Playbook", "description": "레이어 구조를 지키며 새 기능을 추가하는 절차 (엔티티→리포지토리→서비스→DTO→컨트롤러).", "resource": "", "tags": ["playbook", "how-to", "feature"], "body": "# 목적\n\nNAR.GG 백엔드에 새 기능을 일관되게 추가하는 절차. 레이어 구조는 [레이어 구조](/architecture/layered-structure.md) 참조.\n\n# 단계\n\n1. **엔티티** — `domain/{domain}/entity/` 에 JPA 엔티티 추가.\n2. **리포지토리** — `domain/{domain}/repository/` 에 `JpaRepository` 상속. 복잡 쿼리는 `*RepositoryImpl`. → [영속성](/architecture/persistence.md)\n3. **서비스** — `app/{feature}/service/` 에 비즈니스 로직. 생성자 주입(`@RequiredArgsConstructor`). → [컨벤션](/architecture/conventions.md)\n4. **DTO** — `app/{feature}/dto/` 에 `@Data` + `@Builder`. 조회는 DTO projection으로.\n5. **컨트롤러** — `api/v3/` 에 추가 (현행 버전). 모바일 전용이면 `api/mobile/`.\n6. **마이그레이션** — 스키마 변경이 있으면 `src/main/resources/db/migration/VNN__description.sql`. → [마이그레이션 추가](/playbooks/add-migration.md)\n\n# 작업 방식\n\n- `main` 기준 단기 브랜치를 **워크트리**에서 따고, 완료 후 main PR. → [브랜치 워크플로](/operations/branch-workflow.md)\n- 미완성 상태로 머지해야 하면 feature flag로 OFF. → [환경변수](/operations/environment.md)\n\n# 체크리스트\n\n- [ ] 생성자 주입 사용 (필드 주입 없음)\n- [ ] 신규 엔드포인트는 `v3`(또는 `mobile`), `v1` 금지\n- [ ] N+1 회피 (fetch join / DTO projection)\n- [ ] 스키마 변경 시 멱등 마이그레이션 + CI 통과\n- [ ] 서술형 산출물은 한국어\n\n# Citations\n\n[1] [CLAUDE.md — Adding a New Feature](/references/claude-md.md)\n"}, {"id": "playbooks/add-migration", "title": "마이그레이션 추가", "type": "Playbook", "description": "운영 baseline V30을 고려한 멱등 Flyway 마이그레이션 작성·검증 절차.", "resource": "", "tags": ["playbook", "how-to", "flyway", "migration", "database"], "body": "# 목적\n\n운영 [baseline V30](/operations/db-baseline.md) 환경에서 안전한(멱등) Flyway 마이그레이션을 추가하는 절차.\n\n# 단계\n\n1. **번호 정하기** — `src/main/resources/db/migration/`의 최신 `VNN` 다음 번호. 한 번에 하나씩 머지하면 충돌이 없다. → [브랜치 워크플로](/operations/branch-workflow.md)\n2. **파일 작성** — `VNN__description.sql`.\n3. **멱등하게** — 기존 객체를 변경/삭제할 땐 `information_schema` 존재 검사 + `PREPARE/EXECUTE` 패턴. 운영에 V1~V30 객체가 없을 수 있음을 가정. (V41이 참고 사례)\n4. **테스트 픽스처 갱신** — 새 마이그레이션이 pre-V31 컬럼을 참조하면 `src/test/resources/db/pre_v31_schema.sql`에도 그 컬럼이 있는지 확인.\n5. **검증** — MySQL Testcontainers 스키마 테스트가 [PR CI](/operations/ci-cd.md)에서 돈다. 로컬에서 막히면 MySQL 컨테이너에 픽스처+마이그레이션을 직접 적용해 SQL을 검증할 수 있다.\n\n# 멱등 패턴 예시\n\n```sql\nSET @ddl := IF(\n    (SELECT COUNT(*) FROM information_schema.STATISTICS\n     WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'league_match'\n       AND INDEX_NAME = 'idx_example') = 0,\n    'CREATE INDEX idx_example ON league_match (col)',\n    'SELECT 1');\nPREPARE stmt FROM @ddl; EXECUTE stmt; DEALLOCATE PREPARE stmt;\n```\n\n# 체크리스트\n\n- [ ] 번호가 최신 다음이고 다른 미머지 브랜치와 안 겹침\n- [ ] 기존 객체 변경/삭제가 멱등 (존재 검사)\n- [ ] 필요한 pre-V31 컬럼이 테스트 픽스처에 있음\n- [ ] PR CI(`build-and-test`) 통과\n\n# Citations\n\n[1] [운영 DB baseline V30](/operations/db-baseline.md)\n[2] [CLAUDE.md — Flyway migrations](/references/claude-md.md)\n"}, {"id": "operations/environment", "title": "환경변수", "type": "Operations", "description": "자격증명·외부 API 키·기능 플래그를 환경변수로 주입한다. 하드코딩 금지.", "resource": "", "tags": ["operations", "environment", "secrets", "feature-flags", "config"], "body": "# 원칙\n\n모든 자격증명·외부 API 키는 **환경변수로 주입**하며 코드에 하드코딩하지 않는다. 배포 시 GitHub Actions가 시크릿을 주입한다. → [CI/CD](/operations/ci-cd.md)\n\n# 주요 변수\n\n| 분류 | 변수 |\n|------|------|\n| DB | `DB_URL`, `DB_USERNAME`, `DB_PASSWORD` |\n| 검색 | `ELASTICSEARCH_URI` |\n| 외부 API | `YOUTUBE_API_KEY`, `LOL_ESPORTS_KEY`, `RIOT_API_KEY` |\n| 알림 | `DISCORD_WEBHOOK_URL`, `DISCORD_PLAYER_WEBHOOK_URL` |\n| 데이터 | `GOOGLE_DRIVE_CSV_ID` |\n| 인증 | `JWT_SECRET` |\n| 이미지 | `CLOUDINARY_CLOUD_NAME`, `CLOUDINARY_API_KEY`, `CLOUDINARY_API_SECRET` |\n| 푸시 | `FIREBASE_MESSAGING_ENABLED`, `GOOGLE_APPLICATION_CREDENTIALS` |\n\n# 기능 플래그\n\n스케줄·외부 연동을 켜고 끄는 플래그:\n\n- `RIOT_MONITOR_ENABLED`, `RIOT_API_ENABLED` — Riot 라이브 모니터/API → [monitor](/modules/monitor.md), [스케줄링](/architecture/scheduling.md)\n- 미완성 기능을 트렁크에 OFF로 머지할 때 이 패턴을 쓴다. → [브랜치 워크플로](/operations/branch-workflow.md)\n\n# Citations\n\n[1] [CLAUDE.md — Environment Variables](/references/claude-md.md)\n"}, {"id": "operations/branch-workflow", "title": "브랜치 워크플로 (TBD)", "type": "Operations", "description": "트렁크 기반 개발. main이 유일한 트렁크이며 항상 배포 가능. 단기 브랜치 → main PR.", "resource": "", "tags": ["operations", "git", "trunk-based-development", "workflow", "branch"], "body": "# 원칙\n\n트렁크 기반 개발(Trunk-Based Development)을 따른다. `main`이 **유일한 트렁크**이며 **항상 배포 가능한 상태**를 유지한다. (2026-06-21, git-flow의 장수 `v3-dev` 통합 브랜치를 폐기하고 전환함.)\n\n# 규칙\n\n- **`main`은 직접 수정 금지** — PR로만 갱신.\n- 모든 작업은 `main` 기준 **단기 브랜치**(`feat/*`, `fix/*` 등)를 따서 진행하고, `main`을 타깃으로 PR.\n- 브랜치는 짧게 유지(하루~이틀). 장수 develop 류 통합 브랜치를 두지 않는다.\n- **미완성 기능은 feature flag로 OFF 상태로 머지**한다(예: `RIOT_MONITOR_ENABLED`). 미완성 코드를 장수 브랜치에 쌓지 않는다. → [환경변수](/operations/environment.md)\n- 메인 레포 디렉토리는 직접 수정하지 않고 **워크트리**에서 작업한다.\n\n# 머지 게이트\n\nPR은 [CI(`build-and-test`)](/operations/ci-cd.md)를 통과해야만 머지된다. 브랜치 보호로 강제된다.\n\n# Flyway 번호 주의\n\n여러 미머지 브랜치가 각각 새 마이그레이션을 추가하면 번호가 충돌할 수 있다. 한 번에 하나씩 머지하면 자연히 안 겹친다. → [DB 베이스라인](/operations/db-baseline.md), [마이그레이션 추가](/playbooks/add-migration.md)\n\n# Citations\n\n[1] [CLAUDE.md — 브랜치 & 작업 규칙](/references/claude-md.md)\n"}, {"id": "operations/db-baseline", "title": "운영 DB 베이스라인 (V30)", "type": "Operations", "description": "운영 DB는 Flyway baseline V30. V1~V30 객체 존재를 가정하지 말 것. 마이그레이션은 멱등 필수.", "resource": "", "tags": ["operations", "database", "flyway", "migration", "incident"], "body": "# 핵심\n\n운영 DB는 `baseline-version: 30`으로 Flyway가 시작돼, **V1~V30 마이그레이션이 실제로 실행된 적이 없다.** 따라서 dev 스키마에 존재하는 객체(예: V6의 `idx_league_match_name_date` 인덱스)가 운영에는 없을 수 있다.\n\n# 왜 (운영 장애 교훈)\n\n2026-06-11, V41이 `DROP INDEX idx_league_match_name_date`를 **무조건** 실행했다가 운영에서 실패했다. MySQL DDL은 롤백 불가라 Flyway 실패 기록이 남아 앱 기동 불가 → 운영 502 장애. 이후 V41은 `information_schema` 존재 검사 + `PREPARE/EXECUTE`로 멱등화됐다.\n\n# 규칙\n\n- 기존 객체를 변경/삭제할 때는 반드시 **`information_schema` 존재 검사 + `PREPARE/EXECUTE`** 패턴으로 멱등하게 작성한다.\n- 운영 스키마를 dev 기준으로 가정하지 않는다.\n- `FlywayConfig`의 기동 시 `repair()` → `migrate()`가 실패 기록을 정리하지만, **스크립트가 멱등해야** 재실행이 안전하다.\n\n# 테스트 픽스처\n\n`src/test/resources/db/pre_v31_schema.sql`가 \"운영 V30 베이스라인\" 스냅샷이다. V31+ 마이그레이션이 참조하는 pre-V31 컬럼은 이 픽스처에도 있어야 한다. (2026-06-21: `league_match`에 `league_name`이 빠져 V41 인덱스 테스트가 깨져 보강함.) 이 MySQL Testcontainers 스키마 테스트는 이제 [PR CI](/operations/ci-cd.md)가 머지 전 실행한다.\n\n# 마이그레이션 추가 절차\n\n[마이그레이션 추가 플레이북](/playbooks/add-migration.md) 참조. 영속성 전반은 [영속성](/architecture/persistence.md).\n\n# Citations\n\n[1] [CLAUDE.md — Flyway / migrations](/references/claude-md.md)\n[2] 2026-06-11 V41 운영 장애 (502), 2026-06-21 픽스처 보강\n"}, {"id": "operations/monitoring", "title": "모니터링 (Dozzle)", "type": "Operations", "description": "운영 컨테이너 로그를 Dozzle로 본다.", "resource": "https://api.nar.kr/dozzle", "tags": ["operations", "monitoring", "logs", "dozzle"], "body": "# 운영 로그\n\n배포된 컨테이너의 실시간 로그는 **Dozzle**에서 본다: `https://api.nar.kr/dozzle`.\n\n# 헬스체크\n\n배포 파이프라인은 `/v3/api-docs` 엔드포인트로 헬스체크한다. → [CI/CD](/operations/ci-cd.md)\n\n# API 문서\n\n앱 기동 후:\n- Swagger UI: `http://localhost:8080/swagger-ui.html`\n- OpenAPI: `http://localhost:8080/v3/api-docs`\n\n# Citations\n\n[1] [CLAUDE.md — CI/CD (Dozzle)](/references/claude-md.md)\n"}, {"id": "operations/ci-cd", "title": "CI/CD", "type": "Operations", "description": "PR 검증 CI(build+test) + GitHub Actions 배포 + main 브랜치 보호.", "resource": "https://github.com/NAR-GG/nar-back-repo/actions", "tags": ["operations", "ci", "cd", "github-actions", "deploy"], "body": "# 파이프라인 2종\n\n| 워크플로 | 트리거 | 하는 일 |\n|----------|--------|---------|\n| **CI** (`.github/workflows/ci.yml`) | `pull_request` → main | `./gradlew build` (컴파일 + 테스트 + 패키징). 머지 게이트 |\n| **Deploy** (`.github/workflows/deploy.yml`) | `push` → main | Gradle 빌드 → Docker 이미지 → Docker Hub → SSH로 EC2 배포 → `/v3/api-docs` 헬스체크 |\n\n# PR 검증 CI\n\n- 2026-06-21 추가. 그 전엔 `deploy.yml`이 `push:main`에서만 돌고 `-x test`로 **테스트를 건너뛰어** PR 게이트가 없었다.\n- CI는 MySQL 통합 테스트를 러너의 Docker로 Testcontainers 구동한다.\n- 풀컨텍스트 스모크 테스트(`NarApplicationTests`)는 로컬 시크릿이 필요해 clean checkout에서 자동 skip된다.\n\n# 브랜치 보호 (main)\n\n- **PR 필수** (승인 0명 — 솔로 self-merge 허용), 직접 push 금지\n- 필수 상태 체크: **`build-and-test`** (strict — 최신 main 기준 통과 필요)\n- force-push·브랜치 삭제 금지, 대화 해결 필수\n- 관리자 우회는 허용(긴급 escape hatch)\n\n→ 워크플로 전반은 [브랜치 워크플로](/operations/branch-workflow.md), 배포 시크릿은 [환경변수](/operations/environment.md) 참조.\n\n# 운영 로그\n\n배포된 컨테이너 로그는 [Dozzle](/operations/monitoring.md)에서 본다.\n\n# Citations\n\n[1] [CLAUDE.md — CI/CD](/references/claude-md.md)\n[2] [GitHub Actions](https://github.com/NAR-GG/nar-back-repo/actions)\n"}, {"id": "architecture/scheduling", "title": "스케줄링", "type": "Architecture Pattern", "description": "5-thread 풀 기반 정기 작업. LoL Esports 동기화, 메타데이터 sync, Discord 요약, Riot 라이브 모니터.", "resource": "", "tags": ["architecture", "scheduling", "cron", "background-jobs"], "body": "# 원칙\n\n`config/SchedulerConfig.java`가 5-thread 풀을 구성한다. 정기 작업은 이 풀에서 돈다.\n\n# 주요 작업\n\n| 작업 | 주기 | 모듈 |\n|------|------|------|\n| LoL Esports 동기화 (일정·경기·순위) | 30분마다 | [lolesports](/modules/lolesports.md) |\n| 팀 메타데이터 동기화 | 매일 04:15 | [participant](/modules/participant.md) |\n| Discord 일일 요약 | 매일 09:00 | [schedule](/modules/schedule.md) |\n| Riot 라이브 모니터 | 폴 간격 설정 가능 (기본 10초) | [monitor](/modules/monitor.md) |\n\n# 기능 플래그\n\n스케줄 작업은 환경변수로 켜고 끈다 — `RIOT_MONITOR_ENABLED`, `RIOT_API_ENABLED` 등. 미완성·비용 민감 작업은 플래그로 OFF 상태로 둔다. → [환경변수](/operations/environment.md), [브랜치 워크플로](/operations/branch-workflow.md)\n\n# Citations\n\n[1] [CLAUDE.md — Scheduling](/references/claude-md.md)\n"}, {"id": "architecture/layered-structure", "title": "레이어 구조", "type": "Architecture Pattern", "description": "api / app / domain / config / common 5개 레이어로 나뉜 백엔드 패키지 구조.", "resource": "", "tags": ["architecture", "layers", "package-structure"], "body": "# 원칙\n\n코드는 `com.toy.nar` 아래 5개 레이어로 나뉜다. 의존 방향은 위에서 아래로 흐른다 (api → app → domain).\n\n# 레이어\n\n| 레이어 | 위치 | 역할 |\n|--------|------|------|\n| **api** | `api/` | REST 컨트롤러. `v1`(레거시), `v3`(현행), `admin`, `kakao`, `mobile` |\n| **app** | `app/` | 비즈니스 로직, 외부 API 클라이언트, DTO. 도메인 모듈이 여기 모임 → [Modules](/modules/) |\n| **domain** | `domain/` | JPA 엔티티 + 리포지토리 |\n| **config** | `config/` | Spring 빈 설정 (캐시·스케줄러·시큐리티·WebClient 등) |\n| **common** | `common/` | 에러 처리, 필터, 유틸리티 |\n\n# API 버전\n\n- `api/v3/` 가 **현행** 컨트롤러. 신규 엔드포인트는 v3에 추가한다.\n- `api/v1/` 은 레거시 — 신규 작업 금지.\n- `api/mobile/` 는 [`warding`](/overview.md) 모바일 앱 전용 엔드포인트.\n\n# 복잡 쿼리\n\n복잡한 쿼리는 `*RepositoryCustom` + `*RepositoryImpl` 패턴으로 분리한다. → [영속성](/architecture/persistence.md), [컨벤션](/architecture/conventions.md)\n\n# 새 기능 추가\n\n레이어를 가로지르는 새 기능 추가 절차는 [새 기능 추가 플레이북](/playbooks/add-feature.md) 참조.\n\n# Citations\n\n[1] [CLAUDE.md — Architecture / Layer Structure](/references/claude-md.md)\n"}, {"id": "architecture/conventions", "title": "코드 컨벤션", "type": "Architecture Pattern", "description": "생성자 주입, DTO 빌더, 커스텀 예외, DTO projection, 배치 insert 등 핵심 규약.", "resource": "", "tags": ["architecture", "conventions", "code-style"], "body": "# 의존성 주입\n\n- Lombok `@RequiredArgsConstructor`로 **생성자 주입**한다. 필드 주입 금지.\n\n# DTO\n\n- DTO는 `@Data` + `@Builder` 사용.\n- 조회는 `@Query` + DTO projection(`select new ...`)으로 N+1을 피하고 전송량을 줄인다. → [영속성](/architecture/persistence.md)\n\n# 예외 처리\n\n- 커스텀 예외는 `CustomException`을 상속하고 `ErrorCode` enum을 쓴다.\n- 전역 처리는 `GlobalExceptionHandler`가 담당한다.\n\n# 배치\n\n- 배치 insert는 JDBC batch size **50**.\n\n# 언어\n\n- 문서·계획·주석 등 모든 서술형 산출물은 **한국어**로 작성한다.\n\n# Citations\n\n[1] [CLAUDE.md — Key Conventions](/references/claude-md.md)\n"}, {"id": "architecture/caching", "title": "캐싱", "type": "Architecture Pattern", "description": "Caffeine 기반 2-tier 캐시. 휘발성 데이터는 TTL, 불변 데이터는 LRU 무만료.", "resource": "", "tags": ["architecture", "cache", "caffeine", "performance"], "body": "# 원칙\n\n`config/CacheConfig.java`에 두 종류의 캐시 티어를 정의한다. 데이터의 휘발성에 따라 티어를 고른다.\n\n# 티어\n\n| 티어 | 캐시 | 정책 |\n|------|------|------|\n| **휘발성** | `todaySchedules`, `todayMatchDetails` | TTL 1시간 |\n| **불변** | `dailySchedules`, `matchDetails`, `gameRecords` | LRU, 만료 없음 (한 번 기록되면 안 바뀜) |\n\n# 가이드\n\n- 자주 바뀌는 데이터(오늘 일정 등)는 TTL 티어에.\n- 한 번 확정되면 안 바뀌는 과거 기록은 LRU 티어에 둬 재계산을 피한다.\n- 캐시 무효화는 `schedule` 모듈의 `CacheEvictionService` 등에서 명시적으로 처리한다. → [schedule 모듈](/modules/schedule.md)\n\n# Citations\n\n[1] [CLAUDE.md — Caching (Caffeine)](/references/claude-md.md)\n"}, {"id": "architecture/persistence", "title": "영속성", "type": "Architecture Pattern", "description": "JPA/Hibernate(MySQL) + Flyway 마이그레이션 + Elasticsearch 검색의 데이터 계층.", "resource": "", "tags": ["architecture", "jpa", "hibernate", "flyway", "elasticsearch", "mysql"], "body": "# JPA / Hibernate\n\n- MySQL8Dialect 사용.\n- **`open-in-view: false`** — 뷰 렌더링 중 지연 로딩이 막힌다. 필요한 연관은 **명시적 fetch**(fetch join / `@EntityGraph`)로 가져온다.\n- N+1과 과도한 데이터 전송은 `@Query` + DTO projection(`select new ...`)으로 회피한다. → [컨벤션](/architecture/conventions.md)\n- 복잡 쿼리는 `*RepositoryCustom` + `*RepositoryImpl` 패턴.\n\n# Flyway\n\n- 마이그레이션은 `src/main/resources/db/migration/VNN__description.sql`.\n- 운영 DB는 **baseline V30**으로 시작 — V1~V30이 실제 실행된 적이 없어 dev와 스키마가 다를 수 있다. 모든 마이그레이션은 **멱등**해야 한다. → [DB 베이스라인](/operations/db-baseline.md)\n- 기동 시 `FlywayConfig`가 `repair()` → `migrate()` 전략을 적용한다.\n\n# Elasticsearch\n\n- 검색 문서는 별도 리포지토리 설정으로 관리한다. → [search 모듈](/modules/search.md)\n\n# 마이그레이션 추가\n\n새 마이그레이션 작성 절차(번호·멱등 패턴·검증)는 [마이그레이션 추가 플레이북](/playbooks/add-migration.md) 참조.\n\n# Citations\n\n[1] [CLAUDE.md — Data Persistence](/references/claude-md.md)\n[2] [운영 DB baseline V30](/operations/db-baseline.md)\n"}, {"id": "modules/search", "title": "search", "type": "Module", "description": "Elasticsearch 색인과 전문(fulltext) 검색.", "resource": "", "tags": ["module", "search", "elasticsearch", "stub"], "body": "# 상태\n\n🟡 Stub — 추후 상세 보강.\n\n# 역할\n\nElasticsearch에 문서를 색인하고 전문 검색을 제공한다. 검색 문서는 별도 리포지토리 설정으로 관리된다. → [영속성](/architecture/persistence.md)\n\n# 코드 위치\n\n`app/search/`\n\n# 환경\n\n`ELASTICSEARCH_URI` 환경변수로 연결. → [환경변수](/operations/environment.md)\n\n# Citations\n\n[1] [CLAUDE.md — Key Modules: search](/references/claude-md.md)\n"}, {"id": "modules/riot", "title": "riot", "type": "Module", "description": "Riot API 연동 — 선수 랭크·계정 조회.", "resource": "", "tags": ["module", "riot", "api", "rank", "stub"], "body": "# 상태\n\n🟡 Stub — 추후 상세 보강.\n\n# 역할\n\nRiot API와 연동해 선수 랭크·계정 정보를 조회한다.\n\n# 코드 위치\n\n`app/riot/`\n\n# 환경\n\n`RIOT_API_KEY` 사용. `RIOT_API_ENABLED` 플래그로 제어. → [환경변수](/operations/environment.md)\n\n# 관련\n\n- 라이브 경기 모니터링은 [monitor](/modules/monitor.md)가 이 연동을 활용.\n\n# Citations\n\n[1] [CLAUDE.md — Key Modules: riot](/references/claude-md.md)\n"}, {"id": "modules/participant", "title": "participant", "type": "Module", "description": "선수·팀·챔피언 등 참가자 메타데이터 관리.", "resource": "", "tags": ["module", "participant", "player", "team", "champion", "stub"], "body": "# 상태\n\n🟡 Stub — 추후 상세 보강.\n\n# 역할\n\n선수·팀·챔피언 메타데이터를 관리한다. 팀 메타데이터 동기화는 매일 04:15에 돈다. → [스케줄링](/architecture/scheduling.md)\n\n# 코드 위치\n\n`app/participant/` (예: `PlayerRepository`의 LCK 선수 옵션 조회 등)\n\n# 관련\n\n- 분석·일정에서 이 메타데이터를 참조. → [analysis](/modules/analysis.md), [schedule](/modules/schedule.md)\n\n# Citations\n\n[1] [CLAUDE.md — Key Modules: participant](/references/claude-md.md)\n"}, {"id": "modules/schedule", "title": "schedule", "type": "Module", "description": "경기 일정 관리와 알림. 캐시 무효화·Discord 일일 요약 포함.", "resource": "", "tags": ["module", "schedule", "notification", "cache", "stub"], "body": "# 상태\n\n🟡 Stub — 추후 상세 보강.\n\n# 역할\n\n경기 일정을 관리하고 알림을 보낸다. Discord 일일 요약(매일 09:00)과 캐시 무효화(`CacheEvictionService`)를 담당한다. → [스케줄링](/architecture/scheduling.md), [캐싱](/architecture/caching.md)\n\n# 코드 위치\n\n`app/schedule/`\n\n# 관련\n\n- 일정 데이터는 const PALETTE = ["#2f81f7","#3fb950","#db61a2","#d29922","#a371f7","#f0883e","#56d4dd","#e34c4c","#8b949e"];
const types=[...new Set(DATA.nodes.map(n=>n.type))];
const typeColor={}; types.forEach((t,i)=>typeColor[t]=PALETTE[i%PALETTE.length]);
const byId={}; DATA.nodes.forEach(n=>byId[n.id]=n);
// backlinks
const backlinks={}; DATA.nodes.forEach(n=>backlinks[n.id]=[]);
DATA.edges.forEach(e=>{ if(backlinks[e.target]) backlinks[e.target].push(e.source); });
// adjacency for highlight
const adj={}; DATA.nodes.forEach(n=>adj[n.id]=new Set());
DATA.edges.forEach(e=>{adj[e.source]&&adj[e.source].add(e.target);adj[e.target]&&adj[e.target].add(e.source);});

const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W,H,DPR=window.devicePixelRatio||1;
function resize(){const r=cv.parentElement.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener("resize",resize);resize();

// init positions on a circle
const N=DATA.nodes.length;
DATA.nodes.forEach((n,i)=>{const a=2*Math.PI*i/N;n.x=W/2+Math.cos(a)*Math.min(W,H)*0.3;n.y=H/2+Math.sin(a)*Math.min(W,H)*0.3;n.vx=0;n.vy=0;n.deg=adj[n.id].size;});
let selected=null, hover=null, dragging=null, query="", typeF="";

function visible(n){
  if(typeF && n.type!==typeF) return false;
  if(query){const q=query.toLowerCase();
    return n.title.toLowerCase().includes(q)||n.id.toLowerCase().includes(q)||(n.tags||[]).some(t=>t.toLowerCase().includes(q));}
  return true;
}

function tick(){
  // repulsion
  for(let i=0;i<N;i++){const a=DATA.nodes[i];
    for(let j=i+1;j<N;j++){const b=DATA.nodes[j];
      let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||0.01,d=Math.sqrt(d2);
      let f=4200/d2; let fx=dx/d*f,fy=dy/d*f;
      a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}}
  // springs
  DATA.edges.forEach(e=>{const a=byId[e.source],b=byId[e.target];if(!a||!b)return;
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||0.01,f=(d-110)*0.015;
    let fx=dx/d*f,fy=dy/d*f;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;});
  // centering + integrate
  DATA.nodes.forEach(n=>{n.vx+=(W/2-n.x)*0.0012;n.vy+=(H/2-n.y)*0.0012;
    if(n===dragging)return;
    n.vx*=0.86;n.vy*=0.86;n.x+=n.vx;n.y+=n.vy;
    n.x=Math.max(20,Math.min(W-20,n.x));n.y=Math.max(40,Math.min(H-20,n.y));});
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const hl=selected||hover;
  // edges
  ctx.lineWidth=1;
  DATA.edges.forEach(e=>{const a=byId[e.source],b=byId[e.target];if(!a||!b)return;
    const dim = hl && !(hl===a||hl===b);
    const va=visible(a),vb=visible(b);
    ctx.strokeStyle=dim?"rgba(120,130,145,.07)":(va&&vb?"rgba(139,148,158,.35)":"rgba(139,148,158,.08)");
    ctx.beginPath();ctx.moveTo(a.x,a.y);
    // arrowhead
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    let ex=b.x-dx/d*(7+Math.sqrt(b.deg)*1.5),ey=b.y-dy/d*(7+Math.sqrt(b.deg)*1.5);
    ctx.lineTo(ex,ey);ctx.stroke();});
  // nodes
  DATA.nodes.forEach(n=>{
    const r=5+Math.sqrt(n.deg)*1.6;
    const vis=visible(n);
    const dim=hl&&!(hl===n||adj[hl.id].has(n.id));
    ctx.globalAlpha=vis?(dim?0.25:1):0.12;
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);
    ctx.fillStyle=typeColor[n.type]||"#888";ctx.fill();
    if(n===selected){ctx.lineWidth=2.5;ctx.strokeStyle="#fff";ctx.stroke();}
    // label
    if(vis&&(r>7||n===hl||hl===null&&query)){
      ctx.globalAlpha=vis?(dim?0.3:0.92):0.12;
      ctx.fillStyle="#e6edf3";ctx.font="11px -apple-system,sans-serif";ctx.textAlign="center";
      ctx.fillText(n.title.length>18?n.title.slice(0,17)+"…":n.title,n.x,n.y+r+12);}
  });
  ctx.globalAlpha=1;
}
function loop(){tick();draw();requestAnimationFrame(loop);}
loop();

function nodeAt(mx,my){let best=null,bd=1e9;
  DATA.nodes.forEach(n=>{const r=5+Math.sqrt(n.deg)*1.6+4;const d=(n.x-mx)**2+(n.y-my)**2;if(d<r*r&&d<bd){bd=d;best=n;}});return best;}
function rel(ev){const r=cv.getBoundingClientRect();return[ev.clientX-r.left,ev.clientY-r.top];}
cv.addEventListener("mousemove",e=>{const[x,y]=rel(e);if(dragging){dragging.x=x;dragging.y=y;dragging.vx=0;dragging.vy=0;return;}hover=nodeAt(x,y);cv.style.cursor=hover?"pointer":"default";});
cv.addEventListener("mousedown",e=>{const[x,y]=rel(e);const n=nodeAt(x,y);if(n){dragging=n;}});
window.addEventListener("mouseup",e=>{if(dragging){const[x,y]=rel(e);const n=nodeAt(x,y);if(n===dragging)select(n);}dragging=null;});

// ---- markdown (minimal) ----
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,(m,c)=>"<code>"+c+"</code>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,h)=>{
    if(/\.md$/.test(h)){let id=h.startsWith("/")?h.slice(1,-3):h.replace(/^\.\//,"").slice(0,-3);
      return '<a data-nav="'+id+'">'+t+'</a>';}
    return '<a href="'+h+'" target="_blank" rel="noopener">'+t+'</a>';});
  return s;
}
function mdToHtml(md){
  const lines=md.split("\n");let out=[],i=0;
  while(i<lines.length){let l=lines[i];
    if(/^#{1,6}\s/.test(l)){const lv=l.match(/^#+/)[0].length;out.push("<h"+Math.min(lv,2)+">"+inline(l.replace(/^#+\s*/,""))+"</h"+Math.min(lv,2)+">");i++;continue;}
    if(/^```/.test(l)){let buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){buf.push(esc(lines[i]));i++;}i++;out.push("<pre><code>"+buf.join("\n")+"</code></pre>");continue;}
    if(/^\s*\|.*\|/.test(l)){let buf=[];while(i<lines.length&&/^\s*\|.*\|/.test(lines[i])){buf.push(lines[i]);i++;}
      const rows=buf.filter(r=>!/^\s*\|[\s|:-]+\|\s*$/.test(r)).map(r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));
      if(rows.length){let t="<table><tr>"+rows[0].map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr>";
        for(let r=1;r<rows.length;r++)t+="<tr>"+rows[r].map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";out.push(t+"</table>");}continue;}
    if(/^\s*[-*]\s/.test(l)){let buf=[];while(i<lines.length&&/^\s*[-*]\s/.test(lines[i])){buf.push("<li>"+inline(lines[i].replace(/^\s*[-*]\s/,""))+"</li>");i++;}out.push("<ul>"+buf.join("")+"</ul>");continue;}
    if(/^\s*\d+\.\s/.test(l)){let buf=[];while(i<lines.length&&/^\s*\d+\.\s/.test(lines[i])){buf.push("<li>"+inline(lines[i].replace(/^\s*\d+\.\s/,""))+"</li>");i++;}out.push("<ol>"+buf.join("")+"</ol>");continue;}
    if(l.trim()===""){i++;continue;}
    out.push("<p>"+inline(l)+"</p>");i++;}
  return out.join("\n");
}

function select(n){selected=n;render();}
function render(){
  const p=document.getElementById("right");
  if(!selected){p.innerHTML='<div class="empty">노드를 클릭하면 상세가 표시됩니다.</div>';return;}
  const n=selected;
  let html='<div class="kicker" style="color:'+(typeColor[n.type]||'#888')+'">'+esc(n.type)+'</div>';
  html+='<h1>'+esc(n.title)+'</h1>';
  if(n.description)html+='<div class="desc">'+esc(n.description)+'</div>';
  html+='<div class="meta">id: <code>'+esc(n.id)+'</code>';
  if(n.resource)html+=' · <a href="'+esc(n.resource)+'" target="_blank" rel="noopener">resource ↗</a>';
  html+='</div>';
  if(n.tags&&n.tags.length)html+='<div>'+n.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div>';
  html+='<div class="body">'+mdToHtml(n.body)+'</div>';
  const bl=backlinks[n.id]||[];
  if(bl.length){html+='<div class="backlinks"><h3>Cited by ('+bl.length+')</h3><ul>';
    bl.forEach(s=>{html+='<li><a data-nav="'+s+'">'+esc(byId[s]?byId[s].title:s)+'</a></li>';});
    html+='</ul></div>';}
  p.innerHTML=html;p.scrollTop=0;
  p.querySelectorAll("[data-nav]").forEach(a=>a.addEventListener("click",()=>{const t=byId[a.getAttribute("data-nav")];if(t)select(t);}));
}
